<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // MINIMAL TEST</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --border-neon: #1e3a8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: var(--accent-cyan); color: var(--bg-base); }

    .editor-container {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #editorContent {
      width: 100%;
      max-width: 700px;
      height: 60vh;
      background: #111827;
      border: 1px solid var(--border-neon);
      padding: 20px;
      color: white;
      font-size: 16px;
      outline: none;
      border-radius: 4px;
      line-height: 1.5;
    }

    /* POPUP DE TESTE */
    #popupDeteccao {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 320px;
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <header>
    <h1>GraphZO // MÍNIMO</h1>
    <div>
      <button onclick="configurarGitHub()">⚙️ Configurar GitHub</button>
      <button onclick="puxarDoGitHub()">📥 Puxar do GitHub</button>
    </div>
  </header>

  <div class="editor-container">
    <div style="margin-bottom: 10px; color: #9ca3af; font-size: 12px;">
      Digite uma palavra de teste (ex: <strong>Teddy</strong> ou <strong>vento</strong>) e dê espaço:
    </div>
    <div id="editorContent" contenteditable="true" spellcheck="false"></div>
  </div>

  <!-- POPUP -->
  <div id="popupDeteccao">
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
      <span id="popupBadge" style="font-size: 10px; font-weight: bold; padding: 2px 6px; background: var(--accent-cyan); color: black;">TIPO</span>
      <button onclick="fecharPopup()" style="padding: 0 6px; font-size: 10px;">X</button>
    </div>
    <div id="popupPalavra" style="font-size: 16px; font-weight: bold; margin-bottom: 4px;">Palavra</div>
    <div id="popupSignificado" style="font-size: 12px; color: #d1d5db;">Significado aqui...</div>
  </div>

<script>
  // Banco de dados ultra-simplificado para testes imediatos
  let baseDados = {
    personagens: [
      { nome: "Teddy", papel: "Protagonista", bio: "Jovem do Kentucky." }
    ],
    dicionario: [
      { termo: "vento", categoria: "Clima", definicao: "Movimento natural do ar." },
      { termo: "chuva", categoria: "Clima", definicao: "Precipitação de água." }
    ]
  };

  let indiceP = new Map();
  let indiceD = new Map();

  function reconstruirIndices() {
    indiceP.clear();
    indiceD.clear();
    baseDados.personagens.forEach(p => indiceP.set(p.nome.toLowerCase(), p));
    baseDados.dicionario.forEach(d => indiceD.set(d.termo.toLowerCase(), d));
    console.log("Índices carregados com sucesso!");
  }

  window.onload = function() {
    if (!localStorage.getItem("gh_repo")) {
      localStorage.setItem("gh_repo", "andreyoldekamp-del/EditorUltimaMemoria");
    }
    reconstruirIndices();

    // Evento de escuta direta no editor
    const ed = document.getElementById("editorContent");
    ed.addEventListener("input", detectarPalavra);
  };

  function detectarPalavra() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    const node = range.startContainer;
    if (node.nodeType !== Node.TEXT_NODE) return;

    const textoAteCursor = node.textContent.substring(0, range.startOffset);
    const palavras = textoAteCursor.trim().split(/\s+/);
    if (palavras.length === 0) return;

    // Pega a última palavra antes do espaço
    const palavra = palavras[palavras.length - 1].replace(/[.,!?;:]/g, "").toLowerCase();
    if (palavra.length < 2) return;

    // Testa personagem
    if (indiceP.has(palavra)) {
      const p = indiceP.get(palavra);
      mostrarPopup("PERSONAGEM", p.nome, `${p.papel} - ${p.bio}`);
      return;
    }

    // Testa dicionário
    if (indiceD.has(palavra)) {
      const d = indiceD.get(palavra);
      mostrarPopup("DICIONÁRIO", d.termo, `[${d.categoria}] ${d.definicao}`);
      return;
    }
  }

  function mostrarPopup(tipo, termo, texto) {
    const pop = document.getElementById("popupDeteccao");
    document.getElementById("popupBadge").innerText = tipo;
    document.getElementById("popupPalavra").innerText = termo;
    document.getElementById("popupSignificado").innerText = texto;
    pop.style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popupDeteccao").style.display = "none";
  }

  function configurarGitHub() {
    const repo = prompt("Repositório:", localStorage.getItem("gh_repo"));
    const token = prompt("Token GitHub:", localStorage.getItem("gh_token") || "");
    if (repo && token) {
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);
      alert("Configurado!");
    }
  }

  async function puxarDoGitHub() {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!token) { alert("Configure o Token primeiro!"); return; }

    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json();
      if (res.ok) {
        const conteudo = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        if (conteudo.personagens) baseDados.personagens = conteudo.personagens;
        if (conteudo.dicionario) baseDados.dicionario = conteudo.dicionario;
        reconstruirIndices();
        alert("Dados puxados do GitHub com sucesso!");
      } else {
        alert("Erro ao puxar: " + data.message);
      }
    } catch(e) {
      alert("Erro de conexão.");
    }
  }
</script>

</body>
</html>
