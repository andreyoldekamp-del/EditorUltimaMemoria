<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // ÚLTIMA MEMÓRIA [NEON V8]</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --bg-card: #111827;
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-neon: #1e3a8a;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { font-size: 16px; color: var(--accent-cyan); letter-spacing: 1px; }
    h1 span { color: var(--text-muted); font-size: 11px; }

    .nav-bar {
      background: var(--bg-card);
      padding: 8px 24px;
      border-bottom: 1px solid var(--border-neon);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      background: var(--bg-panel);
      padding: 8px 24px;
      border-bottom: 1px solid var(--border-neon);
      align-items: center;
      flex-wrap: wrap;
    }

    button, select {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover, select:hover {
      background: var(--accent-cyan);
      color: var(--bg-base);
    }

    .btn-save { background: var(--success); border-color: var(--success); color: white; }
    .btn-save:hover { background: #059669; }

    .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }
    .btn-danger:hover { background: #dc2626; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    sidebar {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-neon);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 10px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-neon);
      font-size: 12px;
      color: var(--accent-cyan);
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .item-card {
      padding: 8px;
      border-radius: 3px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 11px;
      border: 1px solid transparent;
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card:hover { border-color: var(--accent-cyan); }
    .item-card.active { border-color: var(--accent-cyan); background: #082f49; }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 30px;
    }

    #editorContent {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      min-height: 100%;
      background: var(--bg-card);
      padding: 30px;
      border-radius: 4px;
      border: 1px solid var(--border-neon);
      outline: none;
      font-family: 'Times New Roman', serif;
      font-size: 15px;
      line-height: 1.6;
    }

    #editorContent p { margin-bottom: 1em; }

    .status-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--accent-cyan);
      padding: 6px 24px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>SYS_GRAPHZO // <span>NEON V8</span></h1>
      <div id="lastSavedBadge" style="font-size: 10px; color: var(--success); margin-top: 2px;">🕒 Último salvamento: Nenhum nesta sessão</div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button onclick="configurarGitHub()">⚙️ Configurar</button>
      <button onclick="puxarDoGitHub()">📥 Recarregar Atual</button>
      <button class="btn-save" onclick="salvarNoGitHub()">☁️ Salvar (Push)</button>
    </div>
  </header>

  <div class="nav-bar">
    <button onclick="mudarAba('editor')">📂 01. Editor</button>
    <button onclick="mudarAba('personagens')">👤 02. Personagens</button>
    
    <div style="margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
      <button onclick="listarCommitsGitHub()">📜 Atualizar Lista de Versões</button>
      <select id="selectCommits" onchange="carregarVersaoSelecionada()" style="max-width: 260px;">
        <option value="">-- Selecione uma versão para abrir --</option>
      </select>
      <button class="btn-danger" onclick="descartarVersaoAtual()" title="Oculta esta versão descartável da lista">🗑️ Descartar Versão</button>
    </div>
  </div>

  <div class="toolbar" id="toolbarEditor">
    <button onclick="formatar('bold')"><b>B</b></button>
    <button onclick="formatar('italic')"><i>I</i></button>
    <button onclick="formatar('underline')"><u>U</u></button>
    <select onchange="mudarFonte(this.value)">
      <option value="Times New Roman">Times New Roman</option>
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Courier New">Courier New</option>
    </select>
    <button onclick="inserirParagrafoID()">➕ Novo Parágrafo</button>
    <button onclick="criarNovoCapitulo()">📑 Novo Capítulo</button>
  </div>

  <!-- ABA 1: EDITOR -->
  <div class="main-container" id="containerEditor">
    <sidebar>
      <div class="sidebar-header">📑 CAPÍTULOS</div>
      <div class="list-container" id="chaptersList"></div>
    </sidebar>
    <div class="editor-area">
      <div id="editorContent" contenteditable="true" spellcheck="false" oninput="salvarCapituloAtualNaMemoria()"></div>
    </div>
  </div>

  <!-- ABA 2: PERSONAGENS -->
  <div class="main-container" id="painelPersonagens" style="display: none;">
    <sidebar>
      <div class="sidebar-header">
        <span>👤 ELENCO (<span id="charCount">0</span>)</span>
        <button onclick="criarNovoPersonagem()">+ NOVO</button>
      </div>
      <div class="list-container" id="listaPersonagens"></div>
    </sidebar>
    
    <div style="flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-base);">
      <div id="formPersonagem" style="max-width: 750px; margin: 0 auto; background: var(--bg-card); padding: 25px; border-radius: 4px; border: 1px solid var(--border-neon);">
        
        <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
          <!-- Área da Imagem do Personagem -->
          <div style="width: 150px; height: 150px; background: var(--bg-base); border: 1px solid var(--accent-cyan); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative;">
            <img id="charAvatarPreview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <span id="charNoPhotoText" style="font-size: 10px; color: var(--text-muted); text-align: center; padding: 5px;">Sem imagem</span>
            <input type="file" id="charImageInput" accept="image/*" style="display: none;" onchange="carregarImagemPersonagem(event)">
            <button onclick="document.getElementById('charImageInput').click()" style="position: absolute; bottom: 5px; font-size: 10px; padding: 4px 8px; background: rgba(3,7,18,0.85);">📷 Inserir Foto</button>
          </div>

          <!-- Campos de Texto -->
          <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="charNome" placeholder="Nome do Personagem" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
            <input type="text" id="charPapel" placeholder="Papel (ex: Protagonista, Antagonista)" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
            <input type="text" id="charTags" placeholder="Características (separadas por vírgula)" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
          </div>
        </div>

        <label style="font-size: 11px; color: var(--accent-cyan); display: block; margin-bottom: 6px;">BIOGRAFIA E NOTAS:</label>
        <div id="charBiografia" contenteditable="true" oninput="atualizarPersonagemAtual()" style="min-height: 180px; background: var(--bg-base); border: 1px solid var(--border-neon); padding: 12px; outline: none; border-radius: 2px; line-height: 1.5;"></div>
        
        <div style="margin-top: 15px; text-align: right;">
          <button class="btn-danger" onclick="deletarPersonagemAtual()">🗑️ Excluir Personagem</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">STATUS: PRONTO</span>
    <span id="wordCount">PALAVRAS: 0</span>
  </div>

<script>
  let projetoLivro = {
    "metadados": { "titulo": "Última Memória", "autor": "Autor" },
    "capitulos": {
      "cap_1": { "titulo": "Capítulo 1", "conteudo_xhtml": '<p id="cap_1_p1">Comece a escrever sua história aqui...</p>' }
    },
    "personagens": []
  };

  let capituloAtual = "cap_1";
  let characterSelecionadoId = null;

  function obterDataHoraFormatada() {
    const agora = new Date();
    return agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR');
  }

  window.onload = async function() {
    if (!localStorage.getItem("gh_repo")) {
      localStorage.setItem("gh_repo", "andreyoldekamp-del/EditorUltimaMemoria");
    }
    
    renderizarListaCapitulos();
    carregarCapituloNaTela("cap_1");

    if (localStorage.getItem("gh_token")) {
      await puxarDoGitHub(true);
      await listarCommitsGitHub(true);
    }
  };

  function mudarAba(aba) {
    document.getElementById('containerEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('toolbarEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('painelPersonagens').style.display = aba === 'personagens' ? 'flex' : 'none';
    if (aba === 'personagens') {
      renderizarListaPersonagens();
      if (projetoLivro.personagens.length > 0 && !characterSelecionadoId) {
        selecionarPersonagem(projetoLivro.personagens[0].id);
      }
    }
  }

  function renderizarListaCapitulos() {
    const lista = document.getElementById('chaptersList');
    lista.innerHTML = '';
    for (const [id, cap] of Object.entries(projetoLivro.capitulos)) {
      const item = document.createElement('div');
      item.className = 'item-card' + (id === capituloAtual ? ' active' : '');
      item.innerHTML = `<strong>${cap.titulo}</strong>`;
      item.onclick = () => trocarCapitulo(id);
      lista.appendChild(item);
    }
  }

  function criarNovoCapitulo() {
    const nome = prompt("Nome do novo capítulo:", `Capítulo ${Object.keys(projetoLivro.capitulos).length + 1}`);
    if (!nome) return;
    salvarCapituloAtualNaMemoria();
    const id = 'cap_' + Date.now();
    projetoLivro.capitulos[id] = {
      titulo: nome,
      conteudo_xhtml: `<p id="${id}_p1">Novo capítulo...</p>`
    };
    capituloAtual = id;
    renderizarListaCapitulos();
    carregarCapituloNaTela(id);
  }

  function trocarCapitulo(capId) {
    salvarCapituloAtualNaMemoria();
    capituloAtual = capId;
    renderizarListaCapitulos();
    carregarCapituloNaTela(capId);
  }

  function salvarCapituloAtualNaMemoria() {
    if (projetoLivro.capitulos[capituloAtual]) {
      projetoLivro.capitulos[capituloAtual].conteudo_xhtml = document.getElementById("editorContent").innerHTML;
    }
    atualizarContador();
  }

  function carregarCapituloNaTela(capId) {
    capituloAtual = capId;
    if (projetoLivro.capitulos[capId]) {
      document.getElementById("editorContent").innerHTML = projetoLivro.capitulos[capId].conteudo_xhtml;
      atualizarContador();
    }
  }

  // GERENCIAMENTO DE PERSONAGENS COM SALVAMENTO INSTANTÂNEO EM MEMÓRIA
  function renderizarListaPersonagens() {
    const lista = document.getElementById('listaPersonagens');
    lista.innerHTML = '';
    if (!projetoLivro.personagens) projetoLivro.personagens = [];
    document.getElementById('charCount').innerText = projetoLivro.personagens.length;

    projetoLivro.personagens.forEach(p => {
      const item = document.createElement('div');
      item.className = 'item-card' + (p.id === characterSelecionadoId ? ' active' : '');
      item.innerHTML = `
        <div>
          <strong>${p.nome || 'Sem nome'}</strong><br>
          <small style="color:var(--text-muted)">${p.papel || 'Sem papel'}</small>
        </div>
        ${p.imagemUrl ? '<span>🖼️</span>' : ''}
      `;
      item.onclick = () => selecionarPersonagem(p.id);
      lista.appendChild(item);
    });
  }

  function criarNovoPersonagem() {
    const novo = { 
      id: 'char_' + Date.now(), 
      nome: 'Personagem ' + (projetoLivro.personagens.length + 1), 
      papel: 'Secundário',
      caracteristicas: [],
      imagemUrl: '',
      biografia_xhtml: '<p>Escreva a história do personagem...</p>' 
    };
    if (!projetoLivro.personagens) projetoLivro.personagens = [];
    projetoLivro.personagens.push(novo);
    renderizarListaPersonagens();
    selecionarPersonagem(novo.id);
  }

  function selecionarPersonagem(id) {
    characterSelecionadoId = id;
    const p = projetoLivro.personagens.find(item => item.id === id);
    if (!p) return;
    
    document.getElementById('charNome').value = p.nome || '';
    document.getElementById('charPapel').value = p.papel || '';
    document.getElementById('charTags').value = (p.caracteristicas || []).join(', ');
    document.getElementById('charBiografia').innerHTML = p.biografia_xhtml || '';

    const imgPreview = document.getElementById('charAvatarPreview');
    const noPhotoText = document.getElementById('charNoPhotoText');
    if (p.imagemUrl) {
      imgPreview.src = p.imagemUrl;
      imgPreview.style.display = 'block';
      noPhotoText.style.display = 'none';
    } else {
      imgPreview.style.display = 'none';
      noPhotoText.style.display = 'block';
    }
    renderizarListaPersonagens();
  }

  function atualizarPersonagemAtual() {
    if (!characterSelecionadoId) return;
    const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
    if (!p) return;
    p.nome = document.getElementById('charNome').value;
    p.papel = document.getElementById('charPapel').value;
    p.caracteristicas = document.getElementById('charTags').value.split(',').map(s => s.trim()).filter(Boolean);
    p.biografia_xhtml = document.getElementById('charBiografia').innerHTML;
    renderizarListaPersonagens();
  }

  function deletarPersonagemAtual() {
    if (!characterSelecionadoId) return;
    if (!confirm("Remover este personagem da lista?")) return;
    projetoLivro.personagens = projetoLivro.personagens.filter(p => p.id !== characterSelecionadoId);
    characterSelecionadoId = projetoLivro.personagens.length > 0 ? projetoLivro.personagens[0].id : null;
    renderizarListaPersonagens();
    if (characterSelecionadoId) {
      selecionarPersonagem(characterSelecionadoId);
    } else {
      document.getElementById('charNome').value = '';
      document.getElementById('charPapel').value = '';
      document.getElementById('charTags').value = '';
      document.getElementById('charBiografia').innerHTML = '';
      document.getElementById('charAvatarPreview').style.display = 'none';
    }
  }

  // UPLOAD DE IMAGEM PARA PASTA ASSETS DO GITHUB
  async function carregarImagemPersonagem(event) {
    const file = event.target.files[0];
    if (!file || !characterSelecionadoId) return;

    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) { alert("Configure o Token do GitHub primeiro!"); return; }

    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64Content = e.target.result.split(',')[1];
      const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const fileName = `assets/${characterSelecionadoId}_${cleanName}`;
      const url = `https://api.github.com/repos/${repo}/contents/${fileName}`;

      document.getElementById("statusText").innerText = "STATUS: ENVIANDO FOTO PARA ASSETS/...";
      try {
        const res = await fetch(url, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Foto personagem ${characterSelecionadoId} - ${obterDataHoraFormatada()}`, content: base64Content })
        });

        if (res.ok) {
          const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${fileName}`;
          const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
          p.imagemUrl = rawUrl;
          selecionarPersonagem(characterSelecionadoId);
          document.getElementById("statusText").innerText = "STATUS: FOTO SALVA! CLIQUE EM SALVAR (PUSH) PARA GRAVAR NO JSON.";
        } else {
          const err = await res.json();
          alert("Erro ao enviar imagem: " + err.message);
        }
      } catch (err) {
        alert("Erro de conexão ao enviar imagem.");
      }
    };
    reader.readAsDataURL(file);
  }

  function formatar(cmd) { document.execCommand(cmd, false, null); salvarCapituloAtualNaMemoria(); }
  function mudarFonte(fonte) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const span = document.createElement("span");
    span.style.fontFamily = fonte;
    span.appendChild(sel.getRangeAt(0).extractContents());
    sel.getRangeAt(0).insertNode(span);
    salvarCapituloAtualNaMemoria();
  }
  function inserirParagrafoID() {
    const ed = document.getElementById("editorContent");
    const p = document.createElement("p");
    p.id = `${capituloAtual}_p_${Date.now()}`;
    p.innerHTML = "Novo parágrafo...";
    ed.appendChild(p);
    salvarCapituloAtualNaMemoria();
  }

  function configurarGitHub() {
    const repo = prompt("Repositório:", localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria");
    const token = prompt("Personal Access Token:", localStorage.getItem("gh_token") || "");
    if (repo && token) {
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);
      alert("Configurações salvas!");
    }
  }

  async function salvarNoGitHub() {
    salvarCapituloAtualNaMemoria();
    atualizarPersonagemAtual();

    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) { alert("Configure o Token do GitHub primeiro!"); configurarGitHub(); return; }

    const carimboTempo = obterDataHoraFormatada();
    document.getElementById("statusText").innerText = "STATUS: SALVANDO NA NUVEM...";
    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;

    try {
      let sha = "";
      const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      }

      const jsonString = JSON.stringify(projetoLivro, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

      const putRes = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: `Salvo em ${carimboTempo} (${projetoLivro.personagens.length} personagens)`,
          content: contentBase64,
          sha: sha ? sha : undefined
        })
      });

      const responseData = await putRes.json();
      if (putRes.ok) {
        document.getElementById("lastSavedBadge").innerText = `🕒 Último salvamento: ${carimboTempo}`;
        document.getElementById("statusText").innerText = `STATUS: SALVO COM SUCESSO EM ${carimboTempo}`;
        await listarCommitsGitHub(true);
      } else {
        alert("ERRO DA API DO GITHUB:\nStatus: " + putRes.status + "\nMensagem: " + responseData.message);
      }
    } catch (e) {
      alert("Erro de conexão: " + e.message);
    }
  }

  async function puxarDoGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) return;

    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json();
      if (res.ok) {
        const jsonString = decodeURIComponent(escape(atob(data.content)));
        projetoLivro = JSON.parse(jsonString);
        if(!projetoLivro.personagens) projetoLivro.personagens = [];
        
        renderizarListaCapitulos();
        const primeiroCap = Object.keys(projetoLivro.capitulos)[0];
        if (primeiroCap) carregarCapituloNaTela(primeiroCap);

        renderizarListaPersonagens();
        if (projetoLivro.personagens.length > 0) {
          selecionarPersonagem(projetoLivro.personagens[0].id);
        }

        if(!silencioso) alert("Dados carregados com sucesso!");
      }
    } catch(e) {
      if(!silencioso) console.log("Aguardando primeiro salvamento.");
    }
  }

  // LISTA VERSÕES FILTRANDO AS DESCARTADAS PELO USUÁRIO
  async function listarCommitsGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) { if(!silencioso) alert("Configure o Token primeiro!"); return; }

    const descarteLista = JSON.parse(localStorage.getItem("commits_descartados") || "[]");
    const url = `https://api.github.com/repos/${repo}/commits?path=historia.json`;
    
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const commits = await res.json();
      if (res.ok && Array.isArray(commits)) {
        const sel = document.getElementById("selectCommits");
        sel.innerHTML = '<option value="">-- Selecione uma versão para carregar --</option>';
        
        let validos = 0;
        commits.forEach(c => {
          if (!descarteLista.includes(c.sha)) {
            const opt = document.createElement("option");
            opt.value = c.sha;
            const dt = new Date(c.commit.author.date);
            const horaStr = dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            opt.textContent = `[${horaStr}] ${c.commit.message.substring(0, 30)}`;
            sel.appendChild(opt);
            validos++;
          }
        });
        if(!silencioso) document.getElementById("statusText").innerText = `STATUS: ${validos} VERSÕES DISPONÍVEIS`;
      }
    } catch(e) {
      if(!silencioso) alert("Erro ao listar histórico.");
    }
  }

  // AO SELECIONAR NO MENU, BAIXA E ATUALIZA TUDO AUTOMATICAMENTE
  async function carregarVersaoSelecionada() {
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    const sha = document.getElementById("selectCommits").value;
    if (!token || !sha) return;

    document.getElementById("statusText").innerText = "STATUS: CARREGANDO VERSÃO SELECIONADA...";
    const url = `https://api.github.com/repos/${repo}/contents/historia.json?ref=${sha}`;
    
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json();
      if (res.ok) {
        const jsonString = decodeURIComponent(escape(atob(data.content)));
        projetoLivro = JSON.parse(jsonString);
        if(!projetoLivro.personagens) projetoLivro.personagens = [];
        
        // Atualiza Capítulos
        renderizarListaCapitulos();
        const primeiroCap = Object.keys(projetoLivro.capitulos)[0];
        if (primeiroCap) carregarCapituloNaTela(primeiroCap);

        // Atualiza Personagens
        characterSelecionadoId = null;
        renderizarListaPersonagens();
        if (projetoLivro.personagens.length > 0) {
          selecionarPersonagem(projetoLivro.personagens[0].id);
        } else {
          document.getElementById('charNome').value = '';
          document.getElementById('charPapel').value = '';
          document.getElementById('charTags').value = '';
          document.getElementById('charBiografia').innerHTML = '';
          document.getElementById('charAvatarPreview').style.display = 'none';
        }

        document.getElementById("statusText").innerText = "STATUS: VERSÃO RESTAURADA NO EDITOR E PERSONAGENS!";
      } else {
        alert("Erro ao carregar versão: " + data.message);
      }
    } catch(e) {
      alert("Erro ao processar versão.");
    }
  }

  // OCULTA A VERSÃO SELECIONADA DA LISTA DE HISTÓRICO
  function descartarVersaoAtual() {
    const sel = document.getElementById("selectCommits");
    const sha = sel.value;
    if (!sha) {
      alert("Selecione uma versão na lista primeiro para descartá-la.");
      return;
    }
    if (!confirm("Deseja remover esta versão descartável da sua lista?")) return;

    const descarteLista = JSON.parse(localStorage.getItem("commits_descartados") || "[]");
    if (!descarteLista.includes(sha)) {
      descarteLista.push(sha);
      localStorage.setItem("commits_descartados", JSON.stringify(descarteLista));
    }
    listarCommitsGitHub(true);
    document.getElementById("statusText").innerText = "STATUS: VERSÃO DESCARTADA DA LISTA";
  }

  function atualizarContador() {
    const texto = document.getElementById("editorContent").innerText;
    document.getElementById("wordCount").innerText = `PALAVRAS: ${texto.trim() ? texto.trim().split(/\s+/).length : 0}`;
  }
</script>
