<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // DICIONÁRIO CORRIGIDO</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --border-neon: #1e3a8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, label.file-btn {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: inline-block;
    }

    button:hover, label.file-btn:hover { background: var(--accent-cyan); color: var(--bg-base); }

    .editor-container {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #editorContent {
      width: 100%;
      max-width: 700px;
      height: 60vh;
      background: #111827;
      border: 1px solid var(--border-neon);
      padding: 20px;
      color: white;
      font-size: 16px;
      outline: none;
      border-radius: 4px;
      line-height: 1.5;
    }

    #statusInfo {
      margin-bottom: 10px;
      color: #9ca3af;
      font-size: 12px;
    }

    /* POPUP DE DETECÇÃO */
    #popupDeteccao {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 340px;
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <header>
    <h1>GraphZO // DICIONÁRIO ROBUSTO</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <label class="file-btn">
        📂 Carregar Dicionário (.txt)
        <input type="file" id="txtInput" accept=".txt" style="display: none;" onchange="importarBaseTxt(event)">
      </label>
    </div>
  </header>

  <div class="editor-container">
    <div id="statusInfo">Status: Carregue seu arquivo .txt de dicionário.</div>
    <div id="editorContent" contenteditable="true" spellcheck="false"></div>
  </div>

  <!-- POPUP -->
  <div id="popupDeteccao">
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
      <span id="popupBadge" style="font-size: 10px; font-weight: bold; padding: 2px 6px; background: var(--accent-cyan); color: black;">TIPO</span>
      <button onclick="fecharPopup()" style="padding: 0 6px; font-size: 10px; cursor: pointer;">X</button>
    </div>
    <div id="popupPalavra" style="font-size: 16px; font-weight: bold; margin-bottom: 4px;">Palavra</div>
    <div id="popupSignificado" style="font-size: 12px; color: #d1d5db; max-height: 120px; overflow-y: auto;">Significado aqui...</div>
  </div>

<script>
  let baseDados = {
    personagens: [
      { nome: "Teddy", papel: "Protagonista", bio: "Jovem do Kentucky." },
      { nome: "Jeames", papel: "Irmão", bio: "Irmão mais novo." },
      { nome: "Suzane", papel: "Misteriosa", bio: "Personagem secundária." }
    ],
    dicionario: [
      { termo: "vento", categoria: "Clima", definicao: "Movimento natural do ar." },
      { termo: "casa", categoria: "Local", definicao: "Residência da família." },
      { termo: "noite", categoria: "Tempo", definicao: "Período de escuridão." },
      { termo: "chuva", categoria: "Clima", definicao: "Precipitação de água." },
      { termo: "tempo", categoria: "Meteorologia", definicao: "Condições atmosféricas." },
      { termo: "futuro", categoria: "Conceito", definicao: "Tempo que ainda não chegou." }
    ]
  };

  let indiceGeral = new Map();

  function normalizarChave(texto) {
    if (!texto) return "";
    return texto
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[\u00A0\u200B]/g, " ")
      .replace(/[.,!?;:()"'«»—–-]/g, "")
      .trim()
      .toLowerCase();
  }

  function construirIndiceUnico() {
    indiceGeral.clear();

    baseDados.personagens.forEach(p => {
      let chave = normalizarChave(p.nome);
      if (chave) {
        indiceGeral.set(chave, {
          tipo: "PERSONAGEM",
          palavra: p.nome,
          sub: `Papel: ${p.papel}`,
          significado: p.bio
        });
      }
    });

    baseDados.dicionario.forEach(d => {
      let chave = normalizarChave(d.termo);
      if (chave) {
        indiceGeral.set(chave, {
          tipo: "DICIONÁRIO",
          palavra: d.termo,
          sub: `Categoria: ${d.categoria || 'Geral'}`,
          significado: d.definicao || "Termo registrado no dicionário."
        });
      }
    });

    document.getElementById("statusInfo").innerText = `Status: ${indiceGeral.size} termos indexados prontos para detecção!`;
  }

  window.onload = function() {
    construirIndiceUnico();
    const ed = document.getElementById("editorContent");
    ed.addEventListener("input", detectarPalavra);
  };

  function detectarPalavra() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    const node = range.startContainer;
    if (node.nodeType !== Node.TEXT_NODE) return;

    const textoAteCursor = node.textContent.substring(0, range.startOffset).replace(/\u00A0/g, " ");
    const match = textoAteCursor.match(/([a-zA-ZÀ-ÿ0-9_-]+)[\s.,!?;:]+$/);
    if (!match) return;

    const palavraBruta = match[1];
    const chave = normalizarChave(palavraBruta);

    if (chave.length < 2) return;

    if (indiceGeral.has(chave)) {
      const item = indiceGeral.get(chave);
      mostrarPopup(item.tipo, item.palavra, `${item.sub} — ${item.significado}`);
    }
  }

  // IMPORTAÇÃO MELHORADA PARA LER DIFERENTES FORMATOS DE TXT
  function importarBaseTxt(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById("statusInfo").innerText = "Status: Lendo arquivo de dicionário...";
    const reader = new FileReader();

    reader.onload = function(e) {
      try {
        const conteudo = e.target.result;
        const linhas = conteudo.split(/\r?\n/);
        const termosBrutos = [];

        for (let i = 0; i < linhas.length; i++) {
          const linha = linhas[i].trim();
          if (!linha) continue;

          let termo = "", categoria = "Dicionário", definicao = "Definição do verbete.";

          if (linha.includes("|")) {
            const partes = linha.split("|").map(s => s.trim());
            termo = partes[0];
            if (partes[1]) categoria = partes[1];
            if (partes[2]) definicao = partes[2];
          } else if (linha.includes(":")) {
            const idx = linha.indexOf(":");
            termo = linha.substring(0, idx).trim();
            definicao = linha.substring(idx + 1).trim();
          } else if (linha.includes("-")) {
            const idx = linha.indexOf("-");
            termo = linha.substring(0, idx).trim();
            definicao = linha.substring(idx + 1).trim();
          } else {
            // Se for apenas uma lista de palavras por linha (sem separador)
            termo = linha;
          }

          if (termo.length > 0) {
            termosBrutos.push({ termo, categoria, definicao });
          }
        }

        const META_MAXIMA = 10000;
        let termosFinais = termosBrutos;

        if (termosBrutos.length > META_MAXIMA) {
          const gruposPorLetra = {};
          const alfabetoValido = "abcdefghijklmnopqrstuvwxyzáéíóúâêîôûãõç";

          termosBrutos.forEach(item => {
            let letra = item.termo.charAt(0).toLowerCase();
            if (!alfabetoValido.includes(letra)) letra = '#';
            if (!gruposPorLetra[letra]) gruposPorLetra[letra] = [];
            gruposPorLetra[letra].push(item);
          });

          const chavesLetras = Object.keys(gruposPorLetra);
          const cotaPorLetra = Math.floor(META_MAXIMA / chavesLetras.length);
          let termosEquilibrados = [];

          chavesLetras.forEach(letra => {
            const listaLetra = gruposPorLetra[letra];
            listaLetra.sort(() => Math.random() - 0.5);
            termosEquilibrados.push(...listaLetra.slice(0, cotaPorLetra));
          });

          if (termosEquilibrados.length < META_MAXIMA) {
            const restantes = termosBrutos.filter(t => !termosEquilibrados.includes(t));
            restantes.sort(() => Math.random() - 0.5);
            const vagasFaltantes = META_MAXIMA - termosEquilibrados.length;
            termosEquilibrados.push(...restantes.slice(0, vagasFaltantes));
          }

          termosFinais = termosEquilibrados;
        }

        baseDados.dicionario = termosFinais;
        construirIndiceUnico();
        alert(`Sucesso! Foram indexados ${baseDados.dicionario.length} termos.`);
      } catch (err) {
        alert("Erro ao processar o arquivo.");
      }
    };

    reader.readAsText(file);
  }

  function mostrarPopup(tipo, termo, texto) {
    const pop = document.getElementById("popupDeteccao");
    const badge = document.getElementById("popupBadge");
    
    badge.innerText = tipo;
    badge.style.background = tipo === "PERSONAGEM" ? "var(--accent-purple)" : "var(--accent-cyan)";
    badge.style.color = tipo === "PERSONAGEM" ? "white" : "black";

    document.getElementById("popupPalavra").innerText = termo;
    document.getElementById("popupSignificado").innerText = texto;
    pop.style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popupDeteccao").style.display = "none";
  }
</script>

</body>
</html>
