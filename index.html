<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // ÚLTIMA MEMÓRIA [NEON V10.2 - ROBUSTO]</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --bg-card: #111827;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-neon: #1e3a8a;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { font-size: 16px; color: var(--accent-cyan); letter-spacing: 1px; }
    h1 span { color: var(--text-muted); font-size: 11px; }

    .nav-bar {
      background: var(--bg-card);
      padding: 8px 24px;
      border-bottom: 1px solid var(--border-neon);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      background: var(--bg-panel);
      padding: 8px 24px;
      border-bottom: 1px solid var(--border-neon);
      align-items: center;
      flex-wrap: wrap;
    }

    button, select, label.file-btn {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: 0.2s;
      display: inline-block;
      text-align: center;
    }

    button:hover, select:hover, label.file-btn:hover {
      background: var(--accent-cyan);
      color: var(--bg-base);
    }

    .btn-save { background: var(--success); border-color: var(--success); color: white; }
    .btn-save:hover { background: #059669; }

    .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }
    .btn-danger:hover { background: #dc2626; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    sidebar {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-neon);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 10px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-neon);
      font-size: 12px;
      color: var(--accent-cyan);
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .item-card {
      padding: 8px;
      border-radius: 3px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 11px;
      border: 1px solid transparent;
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card:hover { border-color: var(--accent-cyan); }
    .item-card.active { border-color: var(--accent-cyan); background: #082f49; }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 30px;
      position: relative;
    }

    #editorContent {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      min-height: 100%;
      background: var(--bg-card);
      padding: 30px;
      border-radius: 4px;
      border: 1px solid var(--border-neon);
      outline: none;
      font-family: 'Times New Roman', serif;
      font-size: 15px;
      line-height: 1.6;
    }

    #editorContent p { margin-bottom: 1em; }

    .status-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--accent-cyan);
      padding: 6px 24px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      transition: color 0.3s;
    }

    /* POPUP FLUTUANTE DE DETECÇÃO */
    #popupDeteccao {
      position: fixed;
      bottom: 45px;
      right: 25px;
      width: 360px;
      max-width: 90vw;
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(6, 182, 212, 0.3);
      z-index: 9999;
      display: none;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-neon);
    }

    .badge-tipo {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .badge-personagem { background: var(--accent-purple); color: white; }
    .badge-dicionario { background: var(--accent-cyan); color: var(--bg-base); }

    .popup-palavra {
      font-size: 16px;
      font-weight: bold;
      color: white;
      margin-bottom: 4px;
    }

    .popup-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .popup-significado {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-main);
      max-height: 140px;
      overflow-y: auto;
      background: var(--bg-card);
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>SYS_GRAPHZO // <span>NEON V10.2 [ROBUSTO]</span></h1>
      <div id="lastSavedBadge" style="font-size: 10px; color: var(--success); margin-top: 2px;">🕒 Último salvamento: Nenhum nesta sessão</div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button onclick="configurarGitHub()">⚙️ Configurar</button>
      <button onclick="puxarDoGitHub()">📥 Recarregar Atual</button>
      <button class="btn-save" onclick="salvarNoGitHub()">☁️ Salvar Tudo (Push)</button>
    </div>
  </header>

  <div class="nav-bar">
    <button onclick="mudarAba('editor')">📂 01. Editor</button>
    <button onclick="mudarAba('personagens')">👤 02. Personagens</button>
    <button onclick="mudarAba('dicionario')">📖 03. Dicionário</button>
    
    <div style="margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
      <button onclick="listarCommitsGitHub()">📜 Atualizar Versões</button>
      <select id="selectCommits" onchange="carregarVersaoSelecionada()" style="max-width: 200px;">
        <option value="">-- Versões Git --</option>
      </select>
      <button class="btn-danger" onclick="descartarVersaoAtual()" title="Oculta esta versão da lista">🗑️ Descartar</button>
    </div>
  </div>

  <div class="toolbar" id="toolbarEditor">
    <button onclick="formatar('bold')"><b>B</b></button>
    <button onclick="formatar('italic')"><i>I</i></button>
    <button onclick="formatar('underline')"><u>U</u></button>
    <select onchange="mudarFonte(this.value)">
      <option value="Times New Roman">Times New Roman</option>
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Courier New">Courier New</option>
    </select>
    <button onclick="inserirParagrafoID()">➕ Novo Parágrafo</button>
    <button onclick="criarNovoCapitulo()">📑 Novo Capítulo</button>
    <label style="font-size: 11px; margin-left: auto; display: flex; align-items: center; gap: 5px; cursor: pointer;">
      <input type="checkbox" id="togglePopupAuto" checked> 🔍 Popup Automático
    </label>
  </div>

  <!-- ABA 1: EDITOR -->
  <div class="main-container" id="containerEditor">
    <sidebar>
      <div class="sidebar-header">📑 CAPÍTULOS</div>
      <div class="list-container" id="chaptersList"></div>
    </sidebar>
    <div class="editor-area">
      <div id="editorContent" contenteditable="true" spellcheck="false" oninput="processarTextoDigitado(event)"></div>
    </div>
  </div>

  <!-- ABA 2: PERSONAGENS -->
  <div class="main-container" id="painelPersonagens" style="display: none;">
    <sidebar>
      <div class="sidebar-header">
        <span>👤 ELENCO (<span id="charCount">0</span>)</span>
        <button onclick="criarNovoPersonagem()">+ NOVO</button>
      </div>
      <div class="list-container" id="listaPersonagens"></div>
    </sidebar>
    <div style="flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-base);">
      <div style="max-width: 750px; margin: 0 auto; background: var(--bg-card); padding: 25px; border-radius: 4px; border: 1px solid var(--border-neon);">
        <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
          <div style="width: 150px; height: 150px; background: var(--bg-base); border: 1px solid var(--accent-cyan); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative;">
            <img id="charAvatarPreview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <span id="charNoPhotoText" style="font-size: 10px; color: var(--text-muted);">Sem imagem</span>
            <input type="file" id="charImageInput" accept="image/*" style="display: none;" onchange="carregarImagemPersonagem(event)">
            <button onclick="document.getElementById('charImageInput').click()" style="position: absolute; bottom: 5px; font-size: 10px; padding: 4px 8px; background: rgba(3,7,18,0.85);">📷 Foto</button>
          </div>
          <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="charNome" placeholder="Nome do Personagem" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
            <input type="text" id="charPapel" placeholder="Papel" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
            <input type="text" id="charTags" placeholder="Características" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
          </div>
        </div>
        <label style="font-size: 11px; color: var(--accent-cyan); display: block; margin-bottom: 6px;">BIOGRAFIA:</label>
        <div id="charBiografia" contenteditable="true" oninput="atualizarPersonagemAtual()" style="min-height: 180px; background: var(--bg-base); border: 1px solid var(--border-neon); padding: 12px; outline: none; border-radius: 2px;"></div>
        <div style="margin-top: 15px; text-align: right;"><button class="btn-danger" onclick="deletarPersonagemAtual()">🗑️ Excluir</button></div>
      </div>
    </div>
  </div>

  <!-- ABA 3: DICIONÁRIO E GLOSSÁRIO -->
  <div class="main-container" id="painelDicionario" style="display: none;">
    <sidebar>
      <div class="sidebar-header">
        <span>📖 TERMOS (<span id="termCount">0</span>)</span>
        <button onclick="criarNovoTermo()">+ NOVO</button>
      </div>
      <div class="list-container" id="listaTermos"></div>
    </sidebar>
    <div style="flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-base);">
      <div style="max-width: 750px; margin: 0 auto; background: var(--bg-card); padding: 25px; border-radius: 4px; border: 1px solid var(--border-neon);">
        
        <div style="margin-bottom: 20px; padding: 12px; background: var(--bg-panel); border: 1px dashed var(--accent-cyan); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div>
            <strong>Importar Base (.txt):</strong>
            <div style="font-size: 10px; color: var(--text-muted);">Formato: Termo | Categoria | Descrição</div>
          </div>
          <label class="file-btn">
            📂 Carregar base.txt
            <input type="file" id="txtBaseInput" accept=".txt" style="display: none;" onchange="importarBaseTxt(event)">
          </label>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <input type="text" id="termoTitulo" placeholder="Termo ou Palavra" oninput="atualizarTermoAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
          <input type="text" id="termoCategoria" placeholder="Categoria" oninput="atualizarTermoAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
        </div>

        <label style="font-size: 11px; color: var(--accent-cyan); display: block; margin: 12px 0 6px 0;">DEFINIÇÃO DO TERMO:</label>
        <div id="termoDefinicao" contenteditable="true" oninput="atualizarTermoAtual()" style="min-height: 160px; background: var(--bg-base); border: 1px solid var(--border-neon); padding: 12px; outline: none; border-radius: 2px;"></div>
        
        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
          <button onclick="exportarDicionarioJson()">💾 Exportar dicionario.json</button>
          <button class="btn-danger" onclick="deletarTermoAtual()">🗑️ Excluir Termo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- POPUP DE RESULTADO -->
  <div id="popupDeteccao">
    <div class="popup-header">
      <span id="popupBadge" class="badge-tipo">TIPO</span>
      <button onclick="fecharPopup()" style="padding: 2px 6px; font-size: 10px; border-color: var(--text-muted); color: var(--text-muted);">✖</button>
    </div>
    <div id="popupPalavra" class="popup-palavra">Palavra</div>
    <div id="popupSub" class="popup-sub">Categoria / Papel</div>
    <div id="popupSignificado" class="popup-significado">Significado...</div>
  </div>

  <div class="status-bar">
    <span id="statusText">STATUS: PRONTO | SISTEMA INICIALIZADO</span>
    <span id="wordCount">PALAVRAS: 0</span>
  </div>

<script>
  let projetoLivro = {
    "metadados": { "titulo": "Última Memória", "autor": "Autor" },
    "capitulos": {
      "cap_1": { "titulo": "Capítulo 1", "conteudo_xhtml": '<p id="cap_1_p1">Digite Teddy, Lógica ou Rede e dê espaço para testar a detecção aprimorada...</p>' }
    },
    "personagens": [
      { id: "char_teste", nome: "Teddy", papel: "Protagonista", biografia_xhtml: "<p>Jovem que questiona suas memórias.</p>" }
    ],
    "dicionario": [
      { id: "term_1", termo: "Rede", categoria: "Tecnologia", definicao: "Sistema global de dados interligados." },
      { id: "term_2", termo: "Lógica", categoria: "Filosofia", definicao: "Ciência do raciocínio válido." }
    ]
  };

  let indicePersonagens = new Map();
  let indiceDicionario = new Map();
  let capituloAtual = "cap_1";
  let characterSelecionadoId = null;
  let termoSelecionadoId = null;
  let detectionTimeout = null;

  // =====================================================================
  // UTILITÁRIOS DE ROBUSTEZ
  // =====================================================================
  
  // Normaliza texto: remove acentos e converte para minúsculas (ex: "Lógica" -> "logica")
  function normalizeText(text) {
    if (!text) return "";
    return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  }

  function setGitHubStatus(message, isError = false) {
    const statusEl = document.getElementById("statusText");
    statusEl.innerText = `STATUS: ${message}`;
    statusEl.style.color = isError ? "var(--danger)" : "var(--success)";
    
    // Retorna ao estado normal após 4 segundos
    setTimeout(() => {
      statusEl.style.color = "var(--text-muted)";
      document.getElementById("statusText").innerText = `STATUS: PRONTO | INDEXADOS: ${indicePersonagens.size} PERS. / ${indiceDicionario.size} TERMOS`;
    }, 4000);
  }

  function reconstruirIndices() {
    indicePersonagens.clear();
    indiceDicionario.clear();

    if (Array.isArray(projetoLivro.personagens)) {
      projetoLivro.personagens.forEach(p => {
        if (p && p.nome) {
          indicePersonagens.set(normalizeText(p.nome), p);
        }
      });
    }

    if (Array.isArray(projetoLivro.dicionario)) {
      projetoLivro.dicionario.forEach(t => {
        if (t && t.termo) {
          indiceDicionario.set(normalizeText(t.termo), t);
        }
      });
    }

    document.getElementById("statusText").innerText = `STATUS: PRONTO | INDEXADOS: ${indicePersonagens.size} PERS. / ${indiceDicionario.size} TERMOS`;
  }

  window.onload = async function() {
    if (!localStorage.getItem("gh_repo")) {
      localStorage.setItem("gh_repo", "andreyoldekamp-del/EditorUltimaMemoria");
    }
    reconstruirIndices();
    renderizarListaCapitulos();
    carregarCapituloNaTela("cap_1");

    if (localStorage.getItem("gh_token")) {
      await puxarDoGitHub(true);
      await listarCommitsGitHub(true);
    }
  };

  // =====================================================================
  // MOTOR DE DETECÇÃO APRIMORADO (DEBOUNCE + REGEX + NORMALIZAÇÃO)
  // =====================================================================
  function processarTextoDigitado(event) {
    salvarCapituloAtualNaMemoria();
    
    if (!document.getElementById("togglePopupAuto").checked) {
      fecharPopup();
      return;
    }

    // Debounce: espera 150ms após o usuário parar de digitar para processar
    // Isso evita travamentos e leituras de DOM excessivas
    clearTimeout(detectionTimeout);
    detectionTimeout = setTimeout(() => {
      executarDetecção();
    }, 150);
  }

  function executarDetecção() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    let offset = range.startOffset;

    // Robustez: Navegar para o nó de texto mais próximo se o cursor estiver em um elemento vazio ou entre tags
    if (node.nodeType === Node.ELEMENT_NODE) {
      if (offset > 0 && node.childNodes[offset - 1]?.nodeType === Node.TEXT_NODE) {
        node = node.childNodes[offset - 1];
        offset = node.textContent.length;
      } else if (node.firstChild?.nodeType === Node.TEXT_NODE) {
        node = node.firstChild;
      } else {
        fecharPopup();
        return;
      }
    }

    if (node.nodeType !== Node.TEXT_NODE) {
      fecharPopup();
      return;
    }

    const textoAteCursor = node.textContent.substring(0, offset);
    
    // Regex aprimorada: captura apenas letras (incluindo acentuadas) no final da string
    // Ignora pontuações coladas como "Teddy," ou "Rede."
    const match = textoAteCursor.match(/([a-zA-ZÀ-ÿ]+)$/);

    if (!match) {
      fecharPopup();
      return;
    }

    const palavraCrua = match[1];
    const palavraNormalizada = normalizeText(palavraCrua);

    if (palavraNormalizada.length < 2) {
      fecharPopup();
      return;
    }

    // Busca otimizada nos índices (que já estão normalizados)
    if (indicePersonagens.has(palavraNormalizada)) {
      const p = indicePersonagens.get(palavraNormalizada);
      mostrarPopup("PERSONAGEM", p.nome, `Papel: ${p.papel || 'Principal'}`, p.biografia_xhtml || "Sem biografia.");
      return;
    }

    if (indiceDicionario.has(palavraNormalizada)) {
      const t = indiceDicionario.get(palavraNormalizada);
      mostrarPopup("DICIONÁRIO", t.termo, `Categoria: ${t.categoria || 'Geral'}`, t.definicao || "Sem definição.");
      return;
    }

    // Se chegou aqui, a palavra não foi encontrada. Fecha o popup se estiver aberto.
    fecharPopup();
  }

  function mostrarPopup(tipo, palavra, subtitulo, significadoHtml) {
    const popup = document.getElementById("popupDeteccao");
    const badge = document.getElementById("popupBadge");
    
    badge.innerText = tipo === "PERSONAGEM" ? "👤 PERSONAGEM" : "📖 DICIONÁRIO";
    badge.className = "badge-tipo " + (tipo === "PERSONAGEM" ? "badge-personagem" : "badge-dicionario");
    
    document.getElementById("popupPalavra").innerText = palavra;
    document.getElementById("popupSub").innerText = subtitulo;
    document.getElementById("popupSignificado").innerHTML = significadoHtml;
    
    popup.style.borderColor = tipo === "PERSONAGEM" ? "var(--accent-purple)" : "var(--accent-cyan)";
    popup.style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popupDeteccao").style.display = "none";
  }

  // =====================================================================
  // FUNÇÕES DE INTERFACE E ESTADO
  // =====================================================================
  function mudarAba(aba) {
    document.getElementById('containerEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('toolbarEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('painelPersonagens').style.display = aba === 'personagens' ? 'flex' : 'none';
    document.getElementById('painelDicionario').style.display = aba === 'dicionario' ? 'flex' : 'none';
    
    if (aba === 'personagens') {
      renderizarListaPersonagens();
      if (projetoLivro.personagens.length > 0 && !characterSelecionadoId) selecionarPersonagem(projetoLivro.personagens[0].id);
    } else if (aba === 'dicionario') {
      renderizarListaTermos();
      if (projetoLivro.dicionario.length > 0 && !termoSelecionadoId) selecionarTermo(projetoLivro.dicionario[0].id);
    }
  }

  function renderizarListaCapitulos() {
    const lista = document.getElementById('chaptersList');
    lista.innerHTML = '';
    for (const [id, cap] of Object.entries(projetoLivro.capitulos)) {
      const item = document.createElement('div');
      item.className = 'item-card' + (id === capituloAtual ? ' active' : '');
      item.innerHTML = `<strong>${cap.titulo}</strong>`;
      item.onclick = () => trocarCapitulo(id);
      lista.appendChild(item);
    }
  }

  function criarNovoCapitulo() {
    const nome = prompt("Nome do novo capítulo:", `Capítulo ${Object.keys(projetoLivro.capitulos).length + 1}`);
    if (!nome) return;
    salvarCapituloAtualNaMemoria();
    const id = 'cap_' + Date.now();
    projetoLivro.capitulos[id] = { titulo: nome, conteudo_xhtml: `<p id="${id}_p1">Novo capítulo...</p>` };
    capituloAtual = id;
    renderizarListaCapitulos();
    carregarCapituloNaTela(id);
  }

  function trocarCapitulo(capId) {
    salvarCapituloAtualNaMemoria();
    capituloAtual = capId;
    renderizarListaCapitulos();
    carregarCapituloNaTela(capId);
  }

  function salvarCapituloAtualNaMemoria() {
    if (projetoLivro.capitulos[capituloAtual]) {
      projetoLivro.capitulos[capituloAtual].conteudo_xhtml = document.getElementById("editorContent").innerHTML;
    }
    atualizarContador();
  }

  function carregarCapituloNaTela(capId) {
    capituloAtual = capId;
    if (projetoLivro.capitulos[capId]) {
      document.getElementById("editorContent").innerHTML = projetoLivro.capitulos[capId].conteudo_xhtml;
      atualizarContador();
    }
  }

  function renderizarListaPersonagens() {
    const lista = document.getElementById('listaPersonagens');
    lista.innerHTML = '';
    if (!Array.isArray(projetoLivro.personagens)) projetoLivro.personagens = [];
    document.getElementById('charCount').innerText = projetoLivro.personagens.length;

    projetoLivro.personagens.forEach(p => {
      const item = document.createElement('div');
      item.className = 'item-card' + (p.id === characterSelecionadoId ? ' active' : '');
      item.innerHTML = `<div><strong>${p.nome || 'Sem nome'}</strong><br><small style="color:var(--text-muted)">${p.papel || ''}</small></div>${p.imagemUrl ? '<span>🖼️</span>' : ''}`;
      item.onclick = () => selecionarPersonagem(p.id);
      lista.appendChild(item);
    });
  }

  function criarNovoPersonagem() {
    const novo = { id: 'char_' + Date.now(), nome: 'Novo Personagem', papel: 'Secundário', caracteristicas: [], imagemUrl: '', biografia_xhtml: '<p>Bio...</p>' };
    if (!Array.isArray(projetoLivro.personagens)) projetoLivro.personagens = [];
    projetoLivro.personagens.push(novo);
    reconstruirIndices();
    renderizarListaPersonagens();
    selecionarPersonagem(novo.id);
  }

  function selecionarPersonagem(id) {
    characterSelecionadoId = id;
    const p = projetoLivro.personagens.find(item => item.id === id);
    if (!p) return;
    document.getElementById('charNome').value = p.nome || '';
    document.getElementById('charPapel').value = p.papel || '';
    document.getElementById('charTags').value = (p.caracteristicas || []).join(', ');
    document.getElementById('charBiografia').innerHTML = p.biografia_xhtml || '';

    const imgPreview = document.getElementById('charAvatarPreview');
    const noPhotoText = document.getElementById('charNoPhotoText');
    if (p.imagemUrl) {
      imgPreview.src = p.imagemUrl;
      imgPreview.style.display = 'block';
      noPhotoText.style.display = 'none';
    } else {
      imgPreview.style.display = 'none';
      noPhotoText.style.display = 'block';
    }
    renderizarListaPersonagens();
  }

  function atualizarPersonagemAtual() {
    if (!characterSelecionadoId) return;
    const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
    if (!p) return;
    p.nome = document.getElementById('charNome').value;
    p.papel = document.getElementById('charPapel').value;
    p.caracteristicas = document.getElementById('charTags').value.split(',').map(s => s.trim()).filter(Boolean);
    p.biografia_xhtml = document.getElementById('charBiografia').innerHTML;
    reconstruirIndices();
    renderizarListaPersonagens();
  }

  function deletarPersonagemAtual() {
    if (!characterSelecionadoId) return;
    if (!confirm("Excluir personagem?")) return;
    projetoLivro.personagens = projetoLivro.personagens.filter(p => p.id !== characterSelecionadoId);
    characterSelecionadoId = projetoLivro.personagens.length > 0 ? projetoLivro.personagens[0].id : null;
    reconstruirIndices();
    renderizarListaPersonagens();
    if (characterSelecionadoId) selecionarPersonagem(characterSelecionadoId);
  }

  function renderizarListaTermos() {
    const lista = document.getElementById('listaTermos');
    lista.innerHTML = '';
    if (!Array.isArray(projetoLivro.dicionario)) projetoLivro.dicionario = [];
    document.getElementById('termCount').innerText = projetoLivro.dicionario.length;

    const limiteVisual = projetoLivro.dicionario.slice(0, 200);
    limiteVisual.forEach(t => {
      const item = document.createElement('div');
      item.className = 'item-card' + (t.id === termoSelecionadoId ? ' active' : '');
      item.innerHTML = `<div><strong>${t.termo || 'Novo Termo'}</strong><br><small style="color:var(--text-muted)">${t.categoria || 'Geral'}</small></div>`;
      item.onclick = () => selecionarTermo(t.id);
      lista.appendChild(item);
    });
  }

  function selecionarTermo(id) {
    termoSelecionadoId = id;
    const t = projetoLivro.dicionario.find(item => item.id === id);
    if (!t) return;
    document.getElementById('termoTitulo').value = t.termo || '';
    document.getElementById('termoCategoria').value = t.categoria || '';
    document.getElementById('termoDefinicao').innerHTML = t.definicao || '';
    renderizarListaTermos();
  }

  function atualizarTermoAtual() {
    if (!termoSelecionadoId) return;
    const t = projetoLivro.dicionario.find(item => item.id === termoSelecionadoId);
    if (!t) return;
    t.termo = document.getElementById('termoTitulo').value;
    t.categoria = document.getElementById('termoCategoria').value;
    t.definicao = document.getElementById('termoDefinicao').innerHTML;
    reconstruirIndices();
    renderizarListaTermos();
  }

  function deletarTermoAtual() {
    if (!termoSelecionadoId) return;
    if (!confirm("Excluir termo?")) return;
    projetoLivro.dicionario = projetoLivro.dicionario.filter(t => t.id !== termoSelecionadoId);
    termoSelecionadoId = projetoLivro.dicionario.length > 0 ? projetoLivro.dicionario[0].id : null;
    reconstruirIndices();
    renderizarListaTermos();
    if (termoSelecionadoId) selecionarTermo(termoSelecionadoId);
  }

  function exportarDicionarioJson() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projetoLivro.dicionario));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "dicionario.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    alert("dicionario.json gerado!");
  }

  function importarBaseTxt(event) {
    const file = event.target.files[0];
    if (!file) return;

    setGitHubStatus("PROCESSANDO ARQUIVO TXT...");
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const conteudo = e.target.result;
        const linhas = conteudo.split(/\r?\n/);
        let importados = 0;

        for (let i = 0; i < linhas.length; i++) {
          const linha = linhas[i].trim();
          if (!linha) continue;

          if (linha.includes('|')) {
            const partes = linha.split('|');
            projetoLivro.dicionario.push({
              id: 't_' + i + '_' + Date.now(),
              termo: partes[0].trim(),
              categoria: partes[1] ? partes[1].trim() : 'Geral',
              definicao: partes[2] ? partes[2].trim() : 'Termo registrado.'
            });
          } else {
            projetoLivro.dicionario.push({
              id: 't_' + i + '_' + Date.now(),
              termo: linha,
              categoria: 'Vocabulário',
              definicao: 'Palavra validada.'
            });
          }
          importados++;
        }

        reconstruirIndices();
        renderizarListaTermos();
        setGitHubStatus(`${importados} TERMOS IMPORTADOS COM SUCESSO!`);
      } catch (err) {
        setGitHubStatus("ERRO AO PROCESSAR TXT", true);
        console.error(err);
      }
    };
    reader.readAsText(file);
  }

  function formatar(cmd) { 
    document.execCommand(cmd, false, null); 
    salvarCapituloAtualNaMemoria(); 
  }
  
  function mudarFonte(fonte) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const span = document.createElement("span");
    span.style.fontFamily = fonte;
    span.appendChild(sel.getRangeAt(0).extractContents());
    sel.getRangeAt(0).insertNode(span);
    salvarCapituloAtualNaMemoria();
  }
  
  function inserirParagrafoID() {
    const ed = document.getElementById("editorContent");
    const p = document.createElement("p");
    p.id = `${capituloAtual}_p_${Date.now()}`;
    p.innerHTML = "Novo parágrafo...";
    ed.appendChild(p);
    salvarCapituloAtualNaMemoria();
  }

  function carregarImagemPersonagem(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      if (characterSelecionadoId) {
        const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
        if (p) {
          p.imagemUrl = e.target.result;
          document.getElementById('charAvatarPreview').src = e.target.result;
          document.getElementById('charAvatarPreview').style.display = 'block';
          document.getElementById('charNoPhotoText').style.display = 'none';
          renderizarListaPersonagens();
        }
      }
    };
    reader.readAsDataURL(file);
  }

  // =====================================================================
  // INTEGRAÇÃO GITHUB ROBUSTA (TRATAMENTO DE ERROS E VALIDAÇÃO)
  // =====================================================================
  function configurarGitHub() {
    const repo = prompt("Repositório (ex: usuario/repo):", localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria");
    const token = prompt("Personal Access Token (com permissão 'repo'):", localStorage.getItem("gh_token") || "");
    if (repo && token) {
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);
      alert("Configurações salvas com segurança!");
    }
  }

  async function salvarNoGitHub() {
    salvarCapituloAtualNaMemoria();
    if (characterSelecionadoId) atualizarPersonagemAtual();

    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    
    if (!token) { 
      alert("Configure o Token do GitHub primeiro!"); 
      configurarGitHub(); 
      return; 
    }

    setGitHubStatus("ENVIANDO DADOS PARA O GITHUB...");
    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    
    try {
      let sha = "";
      const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (getRes.ok) {
        sha = (await getRes.json()).sha;
      } else if (getRes.status !== 404) {
        throw new Error(`Falha ao verificar arquivo existente (HTTP ${getRes.status})`);
      }

      const payloadSalvar = {
        metadados: projetoLivro.metadados,
        capitulos: projetoLivro.capitulos,
        personagens: projetoLivro.personagens,
        dicionario: projetoLivro.dicionario.length > 5000 ? projetoLivro.dicionario.slice(0, 500) : projetoLivro.dicionario // Limite de segurança para payload
      };

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(payloadSalvar, null, 2))));
      
      const putRes = await fetch(url, {
        method: "PUT",
        headers: { 
          "Authorization": `token ${token}`, 
          "Content-Type": "application/json",
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify({ 
          message: `Atualização GraphZO: ${new Date().toISOString()}`, 
          content: contentBase64, 
          sha: sha || undefined 
        })
      });

      if (putRes.ok) {
        setGitHubStatus("SALVO NO GITHUB COM SUCESSO!");
        alert("Salvo no GitHub com sucesso!");
        listarCommitsGitHub(true); // Atualiza a lista de versões
      } else {
        const errData = await putRes.json();
        throw new Error(errData.message || `HTTP ${putRes.status}`);
      }
    } catch (e) { 
      console.error("GitHub Save Error:", e);
      setGitHubStatus(`ERRO AO SALVAR: ${e.message}`, true);
      alert(`Erro de conexão ou permissão ao salvar no GitHub:\n${e.message}`); 
    }
  }

  async function puxarDoGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    
    if (!token) {
      if (!silencioso) alert("Token do GitHub não configurado.");
      return;
    }

    if (!silencioso) setGitHubStatus("BAIXANDO DADOS DO GITHUB...");

    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    try {
      const res = await fetch(url, { 
        headers: { 
          "Authorization": `token ${token}`,
          "Accept": "application/vnd.github.v3+json"
        } 
      });

      // Tratamento específico de códigos HTTP
      if (res.status === 401) throw new Error("Token inválido ou expirado (401). Verifique as configurações.");
      if (res.status === 403) throw new Error("Limite de requisições da API atingido ou sem permissão de leitura (403).");
      if (res.status === 404) throw new Error("Arquivo 'historia.json' não encontrado neste repositório (404).");
      if (!res.ok) throw new Error(`Erro HTTP inesperado: ${res.status}`);

      const data = await res.json();
      
      if (!data.content) throw new Error("Resposta do GitHub sem conteúdo válido.");
      
      let carregado;
      try {
        // Decodificação segura de Base64
        const decoded = decodeURIComponent(escape(atob(data.content)));
        carregado = JSON.parse(decoded);
      } catch (parseErr) {
        throw new Error("Falha ao decodificar ou analisar o JSON do GitHub. O arquivo pode estar corrompido.");
      }

      // Validação de Schema (Garante que a estrutura é válida antes de sobrescrever)
      if (typeof carregado !== 'object' || carregado === null) {
        throw new Error("Estrutura de dados inválida no arquivo do GitHub.");
      }

      // Merge Seguro: Preserva dados locais se os do GitHub estiverem incompletos
      if (carregado.metadados) projetoLivro.metadados = { ...projetoLivro.metadados, ...carregado.metadados };
      if (carregado.capitulos && typeof carregado.capitulos === 'object') projetoLivro.capitulos = carregado.capitulos;
      
      if (Array.isArray(carregado.personagens) && carregado.personagens.length > 0) {
        projetoLivro.personagens = carregado.personagens;
      }
      
      if (Array.isArray(carregado.dicionario) && carregado.dicionario.length > 0) {
        projetoLivro.dicionario = carregado.dicionario;
      }

      reconstruirIndices();
      renderizarListaCapitulos();
      
      const firstCap = Object.keys(projetoLivro.capitulos)[0];
      if (firstCap) carregarCapituloNaTela(firstCap);

      if (!silencioso) {
        setGitHubStatus("DADOS CARREGADOS COM SUCESSO!");
        alert("Dados carregados do GitHub com sucesso!");
      }

    } catch (error) {
      console.error("GitHub Fetch Error:", error);
      if (!silencioso) {
        setGitHubStatus(`ERRO: ${error.message}`, true);
        alert(`Falha ao carregar do GitHub:\n${error.message}\n\nO sistema continuará usando os dados locais atuais.`);
      }
    }
  }

  async function listarCommitsGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!token) return;

    const descarteLista = JSON.parse(localStorage.getItem("commits_descartados") || "[]");
    const url = `https://api.github.com/repos/${repo}/commits?path=historia.json`;
    
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (!res.ok) return; // Falha silenciosa para listagem
      
      const commits = await res.json();
      if (Array.isArray(commits)) {
        const sel = document.getElementById("selectCommits");
        sel.innerHTML = '<option value="">-- Versões Git --</option>';
        commits.forEach(c => {
          if (!descarteLista.includes(c.sha)) {
            const opt = document.createElement("option");
            opt.value = c.sha;
            const dt = new Date(c.commit.author.date);
            const msg = c.commit.message ? c.commit.message.substring(0, 25) : "Atualização";
            opt.textContent = `[${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}] ${msg}`;
            sel.appendChild(opt);
          }
        });
      }
    } catch(e) {
      console.error("Erro ao listar commits:", e);
    }
  }

  async function carregarVersaoSelecionada() {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    const sha = document.getElementById("selectCommits").value;
    
    if (!token || !sha) return;

    setGitHubStatus("CARREGANDO VERSÃO ESPECÍFICA...");
    const url = `https://api.github.com/repos/${repo}/contents/historia.json?ref=${sha}`;
    
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      
      const data = await res.json();
      const carregado = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      
      projetoLivro.capitulos = carregado.capitulos || projetoLivro.capitulos;
      projetoLivro.personagens = Array.isArray(carregado.personagens) ? carregado.personagens : [];
      projetoLivro.dicionario = Array.isArray(carregado.dicionario) ? carregado.dicionario : [];
      
      reconstruirIndices();
      renderizarListaCapitulos();
      
      const firstCap = Object.keys(projetoLivro.capitulos)[0];
      if (firstCap) carregarCapituloNaTela(firstCap);
      
      renderizarListaPersonagens();
      setGitHubStatus("VERSÃO HISTÓRICA CARREGADA!");
      alert("Versão histórica carregada com sucesso!");
    } catch(e) {
      setGitHubStatus("ERRO AO CARREGAR VERSÃO", true);
      console.error(e);
    }
  }

  function descartarVersaoAtual() {
    const sha = document.getElementById("selectCommits").value;
    if (!sha) return alert("Selecione uma versão na lista primeiro.");
    
    const descarte = JSON.parse(localStorage.getItem("commits_descartados") || "[]");
    if (!descarte.includes(sha)) {
      descarte.push(sha);
      localStorage.setItem("commits_descartados", JSON.stringify(descarte));
      listarCommitsGitHub(true);
      alert("Versão ocultada da lista com sucesso.");
    }
  }

  function atualizarContador() {
    const texto = document.getElementById("editorContent").innerText;
    document.getElementById("wordCount").innerText = `PALAVRAS: ${texto.trim() ? texto.trim().split(/\s+/).length : 0}`;
  }
