<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Livros</title>
<style>
/* ============ TEMA PADRÃO (dark elegante) ============ */
:root{
  --bg1:#0f1117; --bg2:#1a1d27;
  --text:#e8e6e3; --text2:#a8a6a3; --accent:#7c9eff;
  --gold:#e0b96a; --rose:#ff9eb5; --mint:#8fdfc0; --lavender:#c8b6ff;
  --btn-bg:#252a38; --btn-hover:#2f3647; --btn-pressed:#1c2130;
  --btn-save:#2e7d5b;
  --border:#2c3140; --scroll:#3a4152;
  --editor-bg:#161a24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  display:flex;flex-direction:column;
}

/* ============ SPLASH ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(180deg,#1a1d27 0%,#0f1117 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;transition:opacity .6s;
}
#splash.hidden{opacity:0;pointer-events:none}
.sun{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,#e0b96a,#c98a2e 60%,transparent 70%);
  box-shadow:0 0 60px 20px rgba(224,185,106,.35);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
#splash h1{font-size:26px;font-weight:600;letter-spacing:1px;color:var(--gold)}
#splash .sub{color:var(--text2);font-size:13px}
.floating-words{display:flex;gap:28px;margin-top:8px}
.floating-words span{color:var(--text2);font-size:12px;opacity:.6;animation:float 4s ease-in-out infinite}
.floating-words span:nth-child(2){animation-delay:.6s}
.floating-words span:nth-child(3){animation-delay:1.2s}
.floating-words span:nth-child(4){animation-delay:1.8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#splash .bootbar{width:280px;height:4px;background:#252a38;border-radius:2px;overflow:hidden}
#splash .bootbar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s}
#splash .bootmsg{font-size:11px;color:var(--text2)}

/* ============ APP LAYOUT ============ */
#app{display:flex;flex-direction:column;height:100vh;opacity:0;transition:opacity .5s}
#app.ready{opacity:1}

/* Toolbar superior */
#topbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 12px;background:rgba(0,0,0,.25);
  border-bottom:1px solid var(--border);
}
#topbar .group{display:flex;gap:3px;padding-right:8px;border-right:1px solid var(--border);margin-right:4px}
#topbar .group:last-child{border-right:none}
.tbtn{
  background:var(--btn-bg);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px;
  transition:background .15s;
}
.tbtn:hover{background:var(--btn-hover)}
.tbtn:active{background:var(--btn-pressed)}
.tbtn.active{background:var(--accent);color:#0f1117}
select.tbtn{padding:5px 6px}
input.tbtn{padding:5px 6px;width:60px;background:var(--editor-bg);color:var(--text)}

/* Info página/linha */
#pageinfo{
  margin-left:auto;font-size:12px;color:var(--text2);
  background:rgba(0,0,0,.3);padding:5px 10px;border-radius:6px;
  white-space:nowrap;
}

/* Editor */
#editorwrap{flex:1;overflow:auto;padding:24px;position:relative}
#editor{
  max-width:820px;margin:0 auto;min-height:100%;
  background:var(--editor-bg);
  padding:2.5cm 1.9cm 2.5cm 2.5cm;
  border-radius:8px;border:1px solid var(--border);
  font-family:'Times New Roman',serif;font-size:12pt;line-height:1.15;
  color:var(--text);outline:none;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
  word-wrap:break-word;
}
#editor:focus{outline:2px solid rgba(124,158,255,.35);outline-offset:2px}
#editor[data-empty="true"]::before{
  content:attr(data-placeholder);color:var(--text2);opacity:.5;
}
#editor img{max-width:100%;height:auto;cursor:pointer;border-radius:4px}
#editor img.selected{outline:3px solid var(--accent)}
#editor .chapter-highlight{background:rgba(0,255,255,.18);transition:background .4s}

/* Busca: destaque */
.hl-all{background:#ffeb3b55}
.hl-current{background:#ff980088;outline:1px solid #ff9800}

/* Barra inferior */
#bottombar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 12px;background:rgba(0,0,0,.35);
  border-top:1px solid var(--border);font-size:12px;
}
#bottombar .lbl{color:var(--text2);font-size:11px}
#bottombar .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
#searchCount{color:var(--gold);font-weight:600;min-width:40px;text-align:center}
#bottombar input[type=text]{
  background:var(--editor-bg);color:var(--text);border:1px solid var(--border);
  border-radius:5px;padding:4px 7px;font-size:12px;
}
#bottombar input[type=text]:focus{outline:1px solid var(--accent)}
#bottombar label{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text2)}

/* Menu de contexto */
#ctxmenu{
  position:fixed;z-index:5000;background:var(--btn-bg);
  border:1px solid var(--border);border-radius:8px;padding:6px;
  min-width:230px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6);
  font-size:13px;max-height:80vh;overflow:auto;
}
#ctxmenu.show{display:block}
#ctxmenu .item{
  padding:7px 10px;border-radius:5px;cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;gap:10px;
}
#ctxmenu .item:hover{background:var(--btn-hover)}
#ctxmenu .item.has-sub::after{content:'▸';color:var(--text2)}
#ctxmenu .sub{
  position:absolute;left:100%;top:0;background:var(--btn-bg);
  border:1px solid var(--border);border-radius:8px;padding:6px;
  min-width:200px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6);
}
#ctxmenu .item:hover>.sub{display:block}
#ctxmenu .divider{height:1px;background:var(--border);margin:4px 2px}
#ctxmenu .shortcut{color:var(--text2);font-size:11px}

/* Toast */
#toast{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  background:var(--btn-bg);border:1px solid var(--border);
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:6000;
  opacity:0;transition:opacity .3s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="sun"></div>
  <h1>Editor de Livros</h1>
  <div class="sub">Carregando sua história...</div>
  <div class="bootbar"><div id="bootprogress"></div></div>
  <div class="bootmsg" id="bootmsg">Fase 1/4 — História local</div>
  <div class="floating-words">
    <span>História</span><span>Story</span><span>Geschichte</span><span>Récit</span>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">

  <!-- Topbar -->
  <div id="topbar">
    <div class="group">
      <button class="tbtn" data-cmd="bold" title="Negrito (Ctrl+Shift+B)"><b>B</b></button>
      <button class="tbtn" data-cmd="italic" title="Itálico (Ctrl+Shift+I)"><i>I</i></button>
      <button class="tbtn" data-cmd="underline" title="Sublinhado (Ctrl+Shift+U)"><u>U</u></button>
    </div>
    <div class="group">
      <button class="tbtn" data-cmd="justifyLeft" title="Alinhar esquerda (Ctrl+Shift+E)">⬅</button>
      <button class="tbtn" data-cmd="justifyCenter" title="Centro (Ctrl+Shift+C)">↔</button>
      <button class="tbtn" data-cmd="justifyRight" title="Direita (Ctrl+Shift+D)">➡</button>
    </div>
    <div class="group">
      <select class="tbtn" id="fontFamily" title="Fonte">
        <option value="Times New Roman">Times New Roman</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Garamond">Garamond</option>
        <option value="Courier New">Courier New</option>
        <option value="Verdana">Verdana</option>
      </select>
      <input class="tbtn" type="number" id="fontSize" min="6" max="200" value="12" title="Tamanho (pt)">
    </div>
    <div class="group">
      <select class="tbtn" id="lineSpacing" title="Espaçamento">
        <option value="1.0">1.0</option>
        <option value="1.15" selected>1.15</option>
        <option value="1.5">1.5</option>
        <option value="2.0">2.0</option>
      </select>
      <select class="tbtn" id="margins" title="Margens">
        <option value="none">Sem margem</option>
        <option value="small">Pequena</option>
        <option value="normal" selected>Normal</option>
        <option value="large">Grande</option>
      </select>
    </div>
    <div class="group">
      <button class="tbtn" id="btnA5" title="Formatação A5 (Ctrl+Alt+W)">📖 A5</button>
      <button class="tbtn" id="btnSave" title="Salvar (Ctrl+S)">💾 Salvar</button>
    </div>
    <div class="group">
      <button class="tbtn" id="btnImg" title="Inserir imagem">🖼</button>
      <button class="tbtn" id="btnNarrar" title="Narrar (Ctrl+Shift+V)">🗣</button>
      <button class="tbtn" id="btnGravar" title="Gravar (Ctrl+Shift+G)">🟥</button>
    </div>
    <div id="pageinfo">📄 1/1 • 📝 L1</div>
  </div>

  <!-- Editor -->
  <div id="editorwrap">
    <div id="editor" contenteditable="true" data-placeholder="Comece sua história aqui..." spellcheck="true"></div>
  </div>

  <!-- Bottombar -->
  <div id="bottombar">
    <span class="lbl">Busca:</span>
    <input type="text" id="searchInput" placeholder="Procurar..." style="width:160px">
    <input type="text" id="replaceInput" placeholder="Substituir..." style="width:140px">
    <button class="tbtn" id="btnPrev" title="Anterior">⏪</button>
    <span id="searchCount">0/0</span>
    <button class="tbtn" id="btnNext" title="Próximo">⏩</button>
    <button class="tbtn" id="btnReplaceOne">Subst. 1</button>
    <button class="tbtn" id="btnReplaceAll">Subst. Todos</button>
    <label><input type="checkbox" id="caseSensitive"> Case</label>
    <span class="sep"></span>
    <label><input type="checkbox" id="chkDictionary" checked> Dicionário</label>
    <label><input type="checkbox" id="chkSuggest" checked> Sugestões</label>
    <span class="sep"></span>
    <span class="lbl">Tema:</span>
    <select class="tbtn" id="themeSelect">
      <option value="dark">Dark Elegante</option>
      <option value="light">Claro</option>
      <option value="sepia">Sépia</option>
      <option value="ocean">Oceano</option>
    </select>
    <span class="sep"></span>
    <span class="lbl" id="wordCount">0 palavras</span>
  </div>

  <!-- Menu de contexto -->
  <div id="ctxmenu"></div>
  <div id="toast"></div>
</div>

<!-- Inputs ocultos -->
<input type="file" id="imgPicker" accept="image/*" style="display:none">

<script>
/* ============================================================
   EDITOR DE LIVROS — ETAPA 1
   Fundação: splash, editor, toolbar, busca, página/linha,
   menu de contexto, temas, IndexedDB, atalhos
   ============================================================ */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

/* ---------- IndexedDB (persistência simulando estrutura de pastas) ---------- */
const DB_NAME = 'EditorLivrosDB';
const DB_VERSION = 1;
let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('files')){
        d.createObjectStore('files', { keyPath:'path' });
      }
      if(!d.objectStoreNames.contains('config')){
        d.createObjectStore('config', { keyPath:'key' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function dbPut(store, data){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => res(true);
    tx.onerror = e => rej(e.target.error);
  });
}
function dbGet(store, key){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const rq = tx.objectStore(store).get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = e => rej(e.target.error);
  });
}
function dbGetAll(store){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const rq = tx.objectStore(store).getAll();
    rq.onsuccess = () => res(rq.result);
    rq.onerror = e => rej(e.target.error);
  });
}
function dbDel(store, key){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = e => rej(e.target.error);
  });
}

/* ---------- Estado global ---------- */
const STATE = {
  storyName: 'MinhaHistoria',
  currentPath: '',      // ex: Historias/MinhaHistoria/Historia/MinhaHistoria.xhtml
  html: '',
  dirty: false,
  lastCursor: 0,
  lastScroll: 0,
  search: { hits: [], idx: -1 },
  theme: 'dark',
};

/* ---------- Splash / boot ---------- */
async function boot(){
  const bar = $('#bootprogress');
  const msg = $('#bootmsg');
  const steps = [
    ['Fase 1/4 — História local', 30],
    ['Fase 2/4 — Cursor e scroll', 55],
    ['Fase 3/4 — Personagens', 80],
    ['Fase 4/4 — Revisor narrativo', 100],
  ];
  for(const [text, pct] of steps){
    msg.textContent = text;
    bar.style.width = pct + '%';
    await new Promise(r => setTimeout(r, 350));
  }
  await new Promise(r => setTimeout(r, 400));
  $('#splash').classList.add('hidden');
  $('#app').classList.add('ready');
  setTimeout(() => $('#splash').remove(), 700);
}

/* ---------- Tema ---------- */
const THEMES = {
  dark:   { '--bg1':'#0f1117','--bg2':'#1a1d27','--text':'#e8e6e3','--text2':'#a8a6a3','--accent':'#7c9eff','--gold':'#e0b96a','--btn-bg':'#252a38','--btn-hover':'#2f3647','--btn-pressed':'#1c2130','--border':'#2c3140','--scroll':'#3a4152','--editor-bg':'#161a24' },
  light:  { '--bg1':'#f5f2eb','--bg2':'#e8e2d5','--text':'#2a2620','--text2':'#6b655a','--accent':'#4a6fd4','--gold':'#b8860b','--btn-bg':'#ffffff','--btn-hover':'#f0ece0','--btn-pressed':'#e0dac8','--border':'#d0c9b8','--scroll':'#c0b8a5','--editor-bg':'#fffdf7' },
  sepia:  { '--bg1':'#2b1f14','--bg2':'#3d2c1c','--text':'#e8d8b8','--text2':'#b8a888','--accent':'#d4a24a','--gold':'#e8c878','--btn-bg':'#4a3620','--btn-hover':'#5a4428','--btn-pressed':'#3a2814','--border':'#5a4428','--scroll':'#6a5030','--editor-bg':'#2e2115' },
  ocean:  { '--bg1':'#0a1929','--bg2':'#0f2438','--text':'#d8e8f0','--text2':'#8aacbd','--accent':'#4db8e8','--gold':'#e8b86a','--btn-bg':'#14324a','--btn-hover':'#1c425e','--btn-pressed':'#0e2438','--border':'#1c3a52','--scroll':'#2a5070','--editor-bg':'#0d1f30' },
};
function applyTheme(name){
  const t = THEMES[name] || THEMES.dark;
  const root = document.documentElement;
  for(const [k,v] of Object.entries(t)) root.style.setProperty(k, v);
  STATE.theme = name;
  dbPut('config', { key:'theme', value:name }).catch(()=>{});
}

/* ---------- Editor helpers ---------- */
const editor = $('#editor');

function ensurePath(){
  if(!STATE.currentPath){
    STATE.currentPath = `Historias/${STATE.storyName}/Historia/${STATE.storyName}.xhtml`;
  }
}
function updatePlaceholder(){
  editor.dataset.empty = editor.textContent.trim() === '' && !editor.querySelector('img') ? 'true' : 'false';
}
function countWords(){
  const txt = editor.innerText.replace(/\s+/g,' ').trim();
  return txt ? txt.split(' ').length : 0;
}
function updateWordCount(){
  $('#wordCount').textContent = countWords().toLocaleString('pt-BR') + ' palavras';
}
function updatePageInfo(){
  // 25 linhas por página A5
  const lines = Math.max(1, (editor.innerText.match(/\n/g)||[]).length + Math.ceil(editor.innerText.length/80));
  const page = Math.max(1, Math.ceil(lines/25));
  const totalPages = page; // simplificação: página atual = última visível
  const curLine = getCurrentLine();
  $('#pageinfo').textContent = `📄 ${page}/${totalPages} • 📝 L${curLine}`;
}
function getCurrentLine(){
  const sel = window.getSelection();
  if(!sel.rangeCount) return 1;
  let node = sel.getRangeAt(0).startContainer;
  let pos = sel.getRangeAt(0).startOffset;
  // conta \n até a posição
  const pre = document.createRange();
  pre.selectNodeContents(editor);
  pre.setEnd(node, pos);
  const txt = pre.toString();
  return (txt.match(/\n/g)||[]).length + 1;
}

/* ---------- Busca local ---------- */
function clearHighlights(){
  // Remove marcações de busca do editor (restaura HTML original simplificado)
  editor.querySelectorAll('.hl-all,.hl-current').forEach(el=>{
    const parent = el.parentNode;
    while(el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
  });
  editor.normalize();
}
function highlightSearch(term, caseSensitive){
  clearHighlights();
  STATE.search.hits = [];
  STATE.search.idx = -1;
  if(!term || term.length<1){ updateSearchCount(); return; }
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while(n = walker.nextNode()) nodes.push(n);
  const needle = caseSensitive ? term : term.toLowerCase();
  nodes.forEach(node=>{
    if(node.parentElement.classList.contains('hl-all') || node.parentElement.classList.contains('hl-current')) return;
    const text = node.nodeValue;
    const hay = caseSensitive ? text : text.toLowerCase();
    let i = 0;
    while((i = hay.indexOf(needle, i)) !== -1){
      const range = document.createRange();
      range.setStart(node, i);
      range.setEnd(node, i + term.length);
      const span = document.createElement('span');
      span.className = 'hl-all';
      try{ range.surroundContents(span); }catch(e){ i++; continue; }
      STATE.search.hits.push(span);
      i += term.length;
    }
  });
  if(STATE.search.hits.length){
    STATE.search.idx = 0;
    markCurrent();
  }
  updateSearchCount();
}
function markCurrent(){
  STATE.search.hits.forEach(el=>el.classList.remove('hl-current'));
  const cur = STATE.search.hits[STATE.search.idx];
  if(cur){
    cur.classList.add('hl-current');
    cur.scrollIntoView({behavior:'smooth', block:'center'});
  }
}
function updateSearchCount(){
  const total = STATE.search.hits.length;
  const cur = total ? STATE.search.idx + 1 : 0;
  $('#searchCount').textContent = `${cur}/${total}`;
}
function searchNext(){
  if(!STATE.search.hits.length) return;
  STATE.search.idx = (STATE.search.idx + 1) % STATE.search.hits.length;
  markCurrent();
  updateSearchCount();
}
function searchPrev(){
  if(!STATE.search.hits.length) return;
  STATE.search.idx = (STATE.search.idx - 1 + STATE.search.hits.length) % STATE.search.hits.length;
  markCurrent();
  updateSearchCount();
}
function replaceOne(){
  if(!STATE.search.hits.length) return;
  const cur = STATE.search.hits[STATE.search.idx];
  if(!cur) return;
  const val = $('#replaceInput').value;
  cur.textContent = val;
  const term = $('#searchInput').value;
  highlightSearch(term, $('#caseSensitive').checked);
}
function replaceAll(){
  const term = $('#searchInput').value;
  const val = $('#replaceInput').value;
  if(!term) return;
  editor.innerHTML = editor.innerHTML.replace(new RegExp(escapeRegex(term), 'g'), val);
  highlightSearch(term, $('#caseSensitive').checked);
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ---------- Atalhos ---------- */
function bindShortcuts(){
  document.addEventListener('keydown', e=>{
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    // Arquivo
    if(e.key === 's' && !e.shiftKey && !e.altKey){ e.preventDefault(); save(); }
    // Conversão
    if(e.shiftKey && e.key === 'w'){ e.preventDefault(); toast('Converter para Word (etapa futura)'); }
    if(e.shiftKey && e.key === 'p'){ e.preventDefault(); toast('Converter para PDF (etapa futura)'); }
    // Formatação
    if(e.shiftKey && e.key === 'b'){ e.preventDefault(); document.execCommand('bold'); }
    if(e.shiftKey && e.key === 'i'){ e.preventDefault(); document.execCommand('italic'); }
    if(e.shiftKey && e.key === 'u'){ e.preventDefault(); document.execCommand('underline'); }
    if(e.shiftKey && e.key === 'e'){ e.preventDefault(); document.execCommand('justifyLeft'); }
    if(e.shiftKey && e.key === 'c'){ e.preventDefault(); document.execCommand('justifyCenter'); }
    if(e.shiftKey && e.key === 'd'){ e.preventDefault(); document.execCommand('justifyRight'); }
    // A5
    if(e.altKey && e.key === 'w'){ e.preventDefault(); applyA5(); }
    // Easter egg
    if(e.shiftKey && e.key === '?'){ e.preventDefault(); easterEgg(); }
  });
  // TTS
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key === 'v'){ e.preventDefault(); narrar(); }
    if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key === 'g'){ e.preventDefault(); gravar(); }
  });
}

/* ---------- Formatação ---------- */
function applyA5(){
  editor.style.fontFamily = "'Times New Roman', serif";
  editor.style.fontSize = '12pt';

  toast('Formatação A5 aplicada');
}

/* ---------- TTS / gravação (stub etapa 1, funcional básico) ---------- */
let speaking = false;
function narrar(){
  if(speaking){
    speechSynthesis.cancel();
    speaking = false;
    toast('Narração parada');
    return;
  }
  const txt = window.getSelection().toString() || editor.innerText;
  if(!txt.trim()){ toast('Nada para narrar'); return; }
  const ut = new SpeechSynthesisUtterance(txt);
  ut.lang = 'pt-BR';
  ut.rate = 1;
  ut.onend = () => { speaking = false; toast('Narração concluída'); };
  speechSynthesis.speak(ut);
  speaking = true;
  toast('Narrando...');
}
let mediaRecorder = null;
let recordedChunks = [];
async function gravar(){
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type:'audio/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `gravacao_${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      stream.getTracks().forEach(t=>t.stop());
      toast('Gravação salva');
    };
    mediaRecorder.start();
    toast('Gravando... clique 🟥 para parar');
  }catch(err){
    toast('Microfone indisponível: ' + err.message);
  }
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------- Salvar / carregar ---------- */
async function save(){
  ensurePath();
  const data = {
    path: STATE.currentPath,
    html: editor.innerHTML,
    mtime: Date.now(),
    wordCount: countWords(),
  };
  await dbPut('files', data);
  await dbPut('config', { key:'lastPath', value:STATE.currentPath });
  STATE.dirty = false;
  toast('💾 Salvo: ' + STATE.currentPath.split('/').pop());
}
async function load(){
  ensurePath();
  const f = await dbGet('files', STATE.currentPath);
  if(f && f.html){
    editor.innerHTML = f.html;
  } else {
    editor.innerHTML = '<h1>Minha História</h1><p>Comece a escrever...</p>';
  }
  updatePlaceholder();
  updateWordCount();
  updatePageInfo();
}

  { label:'Copiar', action: ()=>document.execCommand('copy') },
  { label:'Colar', action: ()=>document.execCommand('paste') },
];

function showCtxMenu(x,y){
  const menu = $('#ctxmenu');
  menu.innerHTML = '';
  CTX_ITEMS.forEach(it=>{
    if(it.divider){ const d=document.createElement('div'); d.className='divider'; menu.appendChild(d); return; }
    const el = document.createElement('div');
    el.className = 'item' + (it.sub ? ' has-sub' : '');
    el.innerHTML = `<span>${it.label}</span>${it.shortcut?`<span class="shortcut">${it.shortcut}</span>`:''}`;
    if(it.sub){
      const sub = document.createElement('div');
      sub.className = 'sub';
      it.sub.forEach(s=>{
        const si = document.createElement('div');
        si.className = 'item';
        si.textContent = s.label;
        si.onclick = () => { s.action(); menu.classList.remove('show'); };
        sub.appendChild(si);
      });
      el.appendChild(sub);
    } else if(it.action){
      el.onclick = () => { it.action(); menu.classList.remove('show'); };
    }
    menu.appendChild(el);
  });
  menu.style.left = Math.min(x, window.innerWidth - 250) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 400) + 'px';
  menu.classList.add('show');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('#ctxmenu')) $('#ctxmenu').classList.remove('show');
});
document.addEventListener('contextmenu', e=>{
  if(e.target.closest('#editor')){
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY);
  }
});

/* ---------- Toolbar ---------- */
function bindToolbar(){
  $$('#topbar .tbtn[data-cmd]').forEach(b=>{
    b.onclick = () => document.execCommand(b.dataset.cmd);
  });
  $('#fontFamily').onchange = e => document.execCommand('fontName', false, e.target.value);
  $('#fontSize').onchange = e => {
    const size = parseInt(e.target.value) || 12;
    editor.style.fontSize = size + 'pt';
  };
  $('#lineSpacing').onchange = e => editor.style.lineHeight = e.target.value;
  $('#margins').onchange = e => {
    const m = { none:'0', small:'1cm', normal:'2.5cm', large:'4cm' }[e.target.value];
    editor.style.padding = m;
  };
  $('#btnA5').onclick = applyA5;
  $('#btnSave').onclick = save;
  $('#btnImg').onclick = ()=>$('#imgPicker').click();
  $('#btnNarrar').onclick = narrar;
  $('#btnGravar').onclick = gravar;
}

/* ---------- Imagem ---------- */
$('#imgPicker').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.createElement('img');
    img.src = ev.target.result;
    img.style.maxWidth = '100%';
    insertAtCursor(img);
    toast('Imagem inserida');
  };
  reader.readAsDataURL(f);
};
function insertAtCursor(node){
  const sel = window.getSelection();
  if(!sel.rangeCount){ editor.appendChild(node); return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  range.insertNode(node);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
// colar imagem
editor.addEventListener('paste', e=>{
  const items = e.clipboardData?.items;
  if(!items) return;
  for(const it of items){
    if(it.type.startsWith('image/')){
      e.preventDefault();
      const file = it.getAsFile();
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.createElement('img');
        img.src = ev.target.result;
        insertAtCursor(img);
      };
      reader.readAsDataURL(file);
      return;
    }
  }
});

    ['Ctrl+Shift+W','Word'],['Ctrl+Shift+P','PDF'],['Ctrl+Shift+K','Kindle'],

    ['Ctrl+Shift+E','Esquerda'],['Ctrl+Shift+C','Centro'],['Ctrl+Shift+D','Direita'],
    ['Ctrl+Alt+P','Personagens'],['Ctrl+Alt+I','Pessoais'],['Ctrl+Alt+C','Capítulos'],

    ['Ctrl+Alt+R','Revisor Narrativo'],['Ctrl+Shift+V','Narrar'],['Ctrl+Shift+G','Gravar'],

    ['Ctrl+Alt+U','Característica'],['Ctrl+Alt+W','Formatação A5'],['Ctrl+Shift+?','Atalhos']
  ];
  const w = window.open('', '', 'width=600,height=700');
  w.document.write(`<html><head><title>Atalhos</title><style>body{font-family:system-ui;background:#1a1d27;color:#e8e6e3;padding:20px}h1{color:#e0b96a}table{width:100%;border-collapse:collapse}td{padding:6px 10px;border-bottom:1px solid #2c3140}kbd{background:#252a38;padding:2px 6px;border-radius:4px;font-size:12px}</style></head><body><h1>⌨️ Atalhos</h1><table>${shortcuts.map(([k,v])=>`<tr><td><kbd>${k}</kbd></td><td>${v}</td></tr>`).join('')}</table></body></html>`);
}

editor.addEventListener('input', ()=>{

/* ---------- Init ---------- */
async function init(){
  await openDB();
  const themeCfg = await dbGet('config', 'theme');
  applyTheme(themeCfg?.value || 'dark');
  $('#themeSelect').value = STATE.theme;
  const last = await dbGet('config', 'lastPath');
  if(last?.value) STATE.currentPath = last.value;
  ensurePath();
  await load();
  bindToolbar();
  bindBottomBar();
  bindShortcuts();
  await boot();
}

init().catch(err=>{
  console.error(err);
  document.body.innerHTML = `<pre style="color:#ff8080;padding:20px">Erro ao iniciar: ${err.message}</pre>`;
});
