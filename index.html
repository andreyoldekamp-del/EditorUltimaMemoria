<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GraphZO // ÚLTIMA MEMÓRIA [NEON V12 - REFACTOR]</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --bg-card: #111827;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-neon: #1e3a8a;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      position: relative;
      z-index: 20;
    }

    h1 { font-size: 15px; color: var(--accent-cyan); letter-spacing: 1px; }
    h1 span { color: var(--text-muted); font-size: 11px; }

    .nav-bar {
      background: var(--bg-card);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-neon);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 19;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      background: var(--bg-panel);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-neon);
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 18;
    }

    button, select, label.file-btn {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      touch-action: manipulation;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
    }

    button:active, select:active, label.file-btn:active {
      background: var(--accent-cyan);
      color: var(--bg-base);
    }

    .btn-save { background: var(--success); border-color: var(--success); color: white; }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    aside.sidebar {
      width: 260px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-neon);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 10px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-neon);
      font-size: 12px;
      color: var(--accent-cyan);
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .item-card {
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 6px;
      font-size: 12px;
      border: 1px solid transparent;
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card.active { border-color: var(--accent-cyan); background: #082f49; }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 16px;
    }

    #editorContent {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      min-height: 60vh;
      background: var(--bg-card);
      padding: 20px;
      border-radius: 4px;
      border: 1px solid var(--border-neon);
      outline: none;
      font-family: 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);
    }

    #editorContent p { margin-bottom: 1em; }

    .status-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--accent-cyan);
      padding: 8px 16px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* POPUP FLUTUANTE DE DETECÇÃO */
    #popupDeteccao {
      position: fixed;
      bottom: 45px;
      right: 16px;
      left: 16px;
      max-width: 380px;
      margin-left: auto;
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: none;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-neon);
    }

    .badge-tipo {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 3px;
      font-weight: bold;
    }

    .badge-personagem { background: var(--accent-purple); color: white; }
    .badge-dicionario { background: var(--accent-cyan); color: var(--bg-base); }

    .popup-palavra { font-size: 16px; font-weight: bold; color: white; margin-bottom: 4px; }
    .popup-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .popup-significado {
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-main);
      max-height: 130px;
      overflow-y: auto;
      background: var(--bg-card);
      padding: 8px;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        overflow-y: auto;
      }
      aside.sidebar {
        width: 100%;
        max-height: 180px;
        border-right: none;
        border-bottom: 1px solid var(--border-neon);
      }
      .editor-area { padding: 10px; }
      #editorContent { padding: 14px; min-height: 50vh; }
      .git-controls { width: 100%; margin-left: 0 !important; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>SYS_GRAPHZO // <span>NEON V12</span></h1>
      <div id="lastSavedBadge" style="font-size: 10px; color: var(--success);">🕒 Pronto para edição</div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button type="button" onclick="configurarGitHub()">⚙️ Config</button>
      <button type="button" onclick="puxarDoGitHub()">📥 Puxar</button>
      <button type="button" class="btn-save" onclick="salvarNoGitHub()">☁️ Salvar</button>
    </div>
  </header>

  <div class="nav-bar">
    <button type="button" onclick="mudarAba('editor')">📂 01. Editor</button>
    <button type="button" onclick="mudarAba('personagens')">👤 02. Personagens</button>
    <button type="button" onclick="mudarAba('dicionario')">📖 03. Dicionário</button>
    
    <div class="git-controls" style="margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
      <button type="button" onclick="listarCommitsGitHub()">📜 Versões</button>
      <select id="selectCommits" onchange="carregarVersaoSelecionada()" style="max-width: 170px;">
        <option value="">-- Versões --</option>
      </select>
      <button type="button" class="btn-danger" onclick="descartarVersaoAtual()">🗑️</button>
    </div>
  </div>

  <div class="toolbar" id="toolbarEditor">
    <button type="button" onclick="formatar('bold')"><b>B</b></button>
    <button type="button" onclick="formatar('italic')"><i>I</i></button>
    <button type="button" onclick="formatar('underline')"><u>U</u></button>
    <button type="button" onclick="inserirParagrafoID()">➕ Parágrafo</button>
    <button type="button" onclick="criarNovoCapitulo()">📑 + Cap.</button>
    <label style="font-size: 11px; display: flex; align-items: center; gap: 5px; cursor: pointer;">
      <input type="checkbox" id="togglePopupAuto" checked> 🔍 Popup Auto
    </label>
  </div>

  <!-- ABA 1: EDITOR -->
  <div class="main-container" id="containerEditor">
    <aside class="sidebar">
      <div class="sidebar-header">📑 CAPÍTULOS</div>
      <div class="list-container" id="chaptersList"></div>
    </aside>
    <div class="editor-area">
      <div id="editorContent" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>

  <!-- ABA 2: PERSONAGENS -->
  <div class="main-container" id="painelPersonagens" style="display: none;">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>👤 ELENCO (<span id="charCount">0</span>)</span>
        <button type="button" onclick="criarNovoPersonagem()">+ NOVO</button>
      </div>
      <div class="list-container" id="listaPersonagens"></div>
    </aside>
    <div style="flex: 1; padding: 16px; overflow-y: auto; background: var(--bg-base);">
      <div style="max-width: 750px; margin: 0 auto; background: var(--bg-card); padding: 16px; border-radius: 4px; border: 1px solid var(--border-neon);">
        <div style="display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;">
          <div style="width: 120px; height: 120px; background: var(--bg-base); border: 1px solid var(--accent-cyan); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative;">
            <img id="charAvatarPreview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <span id="charNoPhotoText" style="font-size: 10px; color: var(--text-muted);">Sem foto</span>
            <input type="file" id="charImageInput" accept="image/*" style="display: none;" onchange="carregarImagemPersonagem(event)">
            <button type="button" onclick="document.getElementById('charImageInput').click()" style="position: absolute; bottom: 4px; font-size: 10px; padding: 4px 6px; min-height: 26px;">📷 Foto</button>
          </div>
          <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="charNome" placeholder="Nome do Personagem" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan);">
            <input type="text" id="charPapel" placeholder="Papel" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan);">
            <input type="text" id="charTags" placeholder="Características" oninput="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan);">
          </div>
        </div>
        <label style="font-size: 11px; color: var(--accent-cyan); display: block; margin-bottom: 6px;">BIOGRAFIA:</label>
        <div id="charBiografia" contenteditable="true" oninput="atualizarPersonagemAtual()" style="min-height: 140px; background: var(--bg-base); border: 1px solid var(--border-neon); padding: 10px; outline: none;"></div>
        <div style="margin-top: 12px; text-align: right;"><button type="button" class="btn-danger" onclick="deletarPersonagemAtual()">🗑️ Excluir</button></div>
      </div>
    </div>
  </div>

  <!-- ABA 3: DICIONÁRIO -->
  <div class="main-container" id="painelDicionario" style="display: none;">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>📖 TERMOS (<span id="termCount">0</span>)</span>
        <button type="button" onclick="criarNovoTermo()">+ NOVO</button>
      </div>
      <div class="list-container" id="listaTermos"></div>
    </aside>
    <div style="flex: 1; padding: 16px; overflow-y: auto; background: var(--bg-base);">
      <div style="max-width: 750px; margin: 0 auto; background: var(--bg-card); padding: 16px; border-radius: 4px; border: 1px solid var(--border-neon);">
        
        <div style="margin-bottom: 16px; padding: 12px; background: var(--bg-panel); border: 1px dashed var(--accent-cyan); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div>
            <strong>Importar Base (.txt):</strong>
            <div style="font-size: 10px; color: var(--text-muted);">Termo | Categoria | Descrição (Filtro 10k equilibrado)</div>
          </div>
          <label class="file-btn">
            📂 Carregar .txt
            <input type="file" id="txtBaseInput" accept=".txt,text/plain" style="display: none;" onchange="importarBaseTxt(event)">
          </label>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="termoTitulo" placeholder="Termo ou Palavra" oninput="atualizarTermoAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan);">
          <input type="text" id="termoCategoria" placeholder="Categoria" oninput="atualizarTermoAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan);">
        </div>

        <label style="font-size: 11px; color: var(--accent-cyan); display: block; margin: 12px 0 6px 0;">DEFINIÇÃO:</label>
        <div id="termoDefinicao" contenteditable="true" oninput="atualizarTermoAtual()" style="min-height: 120px; background: var(--bg-base); border: 1px solid var(--border-neon); padding: 10px; outline: none;"></div>
        
        <div style="margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
          <button type="button" onclick="exportarDicionarioJson()">💾 Exportar JSON</button>
          <button type="button" class="btn-danger" onclick="deletarTermoAtual()">🗑️ Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- POPUP DE RESULTADO -->
  <div id="popupDeteccao">
    <div class="popup-header">
      <span id="popupBadge" class="badge-tipo">TIPO</span>
      <button type="button" onclick="fecharPopup()" style="padding: 2px 8px; min-height: 26px; font-size: 11px;">✖</button>
    </div>
    <div id="popupPalavra" class="popup-palavra">Palavra</div>
    <div id="popupSub" class="popup-sub">Categoria / Papel</div>
    <div id="popupSignificado" class="popup-significado">Significado...</div>
  </div>

  <div class="status-bar">
    <span id="statusText">ÍNDICE: ATIVO</span>
    <span id="wordCount">PALAVRAS: 0</span>
  </div>

<script>
  let projetoLivro = {
    "metadados": { "titulo": "Última Memória", "autor": "Autor" },
    "capitulos": {
      "cap_1": { "titulo": "Capítulo 1", "conteudo_xhtml": '<p id="cap_1_p1">Digite Teddy ou uma palavra e dê espaço...</p>' }
    },
    "personagens": [
      { id: "char_teste", nome: "Teddy", papel: "Protagonista", biografia_xhtml: "<p>Jovem do Kentucky que questiona suas memórias.</p>" }
    ],
    "dicionario": [
      { id: "term_1", termo: "Rede", categoria: "Tecnologia", definicao: "Sistema global de dados interligados." }
    ]
  };

  let indicePersonagens = new Map();
  let indiceDicionario = new Map();

  let capituloAtual = "cap_1";
  let characterSelecionadoId = null;
  let termoSelecionadoId = null;
  let ultimaPalavraPopup = "";

  function normalizarChave(texto) {
    return texto
      .replace(/[\u00A0\u200B]/g, " ")
      .replace(/[.,!?;:()"'«»—–-]/g, "")
      .trim()
      .toLowerCase();
  }

  function reconstruirIndices() {
    indicePersonagens.clear();
    indiceDicionario.clear();

    if (projetoLivro.personagens) {
      projetoLivro.personagens.forEach(p => {
        if (p.nome) indicePersonagens.set(normalizarChave(p.nome), p);
      });
    }

    if (projetoLivro.dicionario) {
      projetoLivro.dicionario.forEach(t => {
        if (t.termo) indiceDicionario.set(normalizarChave(t.termo), t);
      });
    }

    document.getElementById("statusText").innerText = `INDEXADOS: ${indicePersonagens.size} PERS. / ${indiceDicionario.size} TERMOS`;
  }

  window.addEventListener("DOMContentLoaded", async function() {
    if (!localStorage.getItem("gh_repo")) {
      localStorage.setItem("gh_repo", "andreyoldekamp-del/EditorUltimaMemoria");
    }

    const editor = document.getElementById("editorContent");
    editor.addEventListener("input", processarEntradaTexto);
    editor.addEventListener("keyup", processarEntradaTexto);

    reconstruirIndices();
    renderizarListaCapitulos();
    carregarCapituloNaTela("cap_1");

    if (localStorage.getItem("gh_token")) {
      await puxarDoGitHub(true);
      await listarCommitsGitHub(true);
    }
  });

  function processarEntradaTexto() {
    salvarCapituloAtualNaMemoria();
    if (!document.getElementById("togglePopupAuto").checked) return;

    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    let node = range.startContainer;

    let textoAntes = "";
    if (node.nodeType === Node.TEXT_NODE) {
      textoAntes = node.textContent.substring(0, range.startOffset);
    } else if (node.innerText) {
      textoAntes = node.innerText;
    }

    textoAntes = textoAntes.replace(/\u00A0/g, " ");

    const match = textoAntes.match(/([a-zA-ZÀ-ÿ0-9_-]+)[\s.,!?;:]+$/);
    if (!match) return;

    const chave = normalizarChave(match[1]);
    if (chave.length < 2 || chave === ultimaPalavraPopup) return;

    if (indicePersonagens.has(chave)) {
      ultimaPalavraPopup = chave;
      const p = indicePersonagens.get(chave);
      mostrarPopup("PERSONAGEM", p.nome, `Papel: ${p.papel || 'Principal'}`, p.biografia_xhtml || "Sem biografia.");
      return;
    }

    if (indiceDicionario.has(chave)) {
      ultimaPalavraPopup = chave;
      const t = indiceDicionario.get(chave);
      mostrarPopup("DICIONÁRIO", t.termo, `Categoria: ${t.categoria || 'Geral'}`, t.definicao || "Sem definição.");
      return;
    }
  }

  function mostrarPopup(tipo, palavra, subtitulo, significadoHtml) {
    const popup = document.getElementById("popupDeteccao");
    const badge = document.getElementById("popupBadge");
    
    badge.innerText = tipo === "PERSONAGEM" ? "👤 PERSONAGEM" : "📖 DICIONÁRIO";
    badge.className = "badge-tipo " + (tipo === "PERSONAGEM" ? "badge-personagem" : "badge-dicionario");
    
    document.getElementById("popupPalavra").innerText = palavra;
    document.getElementById("popupSub").innerText = subtitulo;
    document.getElementById("popupSignificado").innerHTML = significadoHtml;
    
    popup.style.borderColor = tipo === "PERSONAGEM" ? "var(--accent-purple)" : "var(--accent-cyan)";
    popup.style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popupDeteccao").style.display = "none";
    ultimaPalavraPopup = "";
  }

  function mudarAba(aba) {
    document.getElementById('containerEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('toolbarEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('painelPersonagens').style.display = aba === 'personagens' ? 'flex' : 'none';
    document.getElementById('painelDicionario').style.display = aba === 'dicionario' ? 'flex' : 'none';
    
    if (aba === 'personagens') {
      renderizarListaPersonagens();
      if (projetoLivro.personagens.length > 0 && !characterSelecionadoId) selecionarPersonagem(projetoLivro.personagens[0].id);
    } else if (aba === 'dicionario') {
      renderizarListaTermos();
      if (projetoLivro.dicionario.length > 0 && !termoSelecionadoId) selecionarTermo(projetoLivro.dicionario[0].id);
    }
  }

  function renderizarListaCapitulos() {
    const lista = document.getElementById('chaptersList');
    lista.innerHTML = '';
    for (const [id, cap] of Object.entries(projetoLivro.capitulos)) {
      const item = document.createElement('div');
      item.className = 'item-card' + (id === capituloAtual ? ' active' : '');
      item.innerHTML = `<strong>${cap.titulo}</strong>`;
      item.onclick = () => trocarCapitulo(id);
      lista.appendChild(item);
    }
  }

  function criarNovoCapitulo() {
    const nome = prompt("Nome do capítulo:", `Capítulo ${Object.keys(projetoLivro.capitulos).length + 1}`);
    if (!nome) return;
    salvarCapituloAtualNaMemoria();
    const id = 'cap_' + Date.now();
    projetoLivro.capitulos[id] = { titulo: nome, conteudo_xhtml: `<p id="${id}_p1">Novo capítulo...</p>` };
    capituloAtual = id;
    renderizarListaCapitulos();
    carregarCapituloNaTela(id);
  }

  function trocarCapitulo(capId) {
    salvarCapituloAtualNaMemoria();
    capituloAtual = capId;
    renderizarListaCapitulos();
    carregarCapituloNaTela(capId);
  }

  function salvarCapituloAtualNaMemoria() {
    if (projetoLivro.capitulos[capituloAtual]) {
      projetoLivro.capitulos[capituloAtual].conteudo_xhtml = document.getElementById("editorContent").innerHTML;
    }
    atualizarContador();
  }

  function carregarCapituloNaTela(capId) {
    capituloAtual = capId;
    if (projetoLivro.capitulos[capId]) {
      document.getElementById("editorContent").innerHTML = projetoLivro.capitulos[capId].conteudo_xhtml;
      atualizarContador();
    }
  }

  function renderizarListaPersonagens() {
    const lista = document.getElementById('listaPersonagens');
    lista.innerHTML = '';
    if (!projetoLivro.personagens) projetoLivro.personagens = [];
    document.getElementById('charCount').innerText = projetoLivro.personagens.length;

    projetoLivro.personagens.forEach(p => {
      const item = document.createElement('div');
      item.className = 'item-card' + (p.id === characterSelecionadoId ? ' active' : '');
      item.innerHTML = `<div><strong>${p.nome || 'Sem nome'}</strong><br><small style="color:var(--text-muted)">${p.papel || ''}</small></div>${p.imagemUrl ? '<span>🖼️</span>' : ''}`;
      item.onclick = () => selecionarPersonagem(p.id);
      lista.appendChild(item);
    });
  }

  function criarNovoPersonagem() {

/**
 * Importa um arquivo .txt de dicionário, aplica um filtro equilibrado 
 * de até 10.000 termos (proporcional por letra inicial) e atualiza o sistema.
 */
function importarBaseTxt(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const statusEl = document.getElementById("statusText");
  statusEl.innerText = "STATUS: LENDO ARQUIVO DE TEXTO...";

  const reader = new FileReader();

  reader.onerror = () => {
    statusEl.innerText = "STATUS: ERRO NA LEITURA";
    alert("Falha ao ler o arquivo selecionado.");
  };

  reader.onload = (e) => {
    try {
      statusEl.innerText = "STATUS: PROCESSANDO TERMOS...";
      const conteudo = e.target.result;
      const linhas = conteudo.split(/\r?\n/);
      const termosBrutos = [];

      // 1. Parseamento e limpeza das linhas do arquivo
      linhas.forEach((linhaOriginal, index) => {
        const linha = linhaOriginal.trim();
        if (!linha) return;

        let termo = "";
        let categoria = "Geral";
        let definicao = "Termo registrado.";

        if (linha.includes("|")) {
          const partes = linha.split("|").map(s => s.trim());
          termo = partes[0] || "";
          categoria = partes[1] || "Geral";
          definicao = partes[2] || "Termo registrado.";
        } else if (linha.includes(":")) {
          const idx = linha.indexOf(":");
          termo = linha.substring(0, idx).trim();
          definicao = linha.substring(idx + 1).trim();
          categoria = "Dicionário";
        } else {
          termo = linha;
          categoria = "Vocabulário";
        }

        if (termo.length > 0) {
          termosBrutos.push({
            id: `t_${index}_${Math.floor(Math.random() * 10000)}`,
            termo,
            categoria,
            definicao
          });
        }
      });

      statusEl.innerText = "STATUS: APLICANDO FILTRO EQUILIBRADO (10K)...";

      const META_MAXIMA = 10000;
      let termosFinais = termosBrutos;

      // 2. Amostragem proporcional por letra inicial (se exceder a meta)
      if (termosBrutos.length > META_MAXIMA) {
        const gruposPorLetra = {};
        const alfabetoValido = "abcdefghijklmnopqrstuvwxyzáéíóúâêîôûãõç";

        termosBrutos.forEach(item => {
          let letra = item.termo.charAt(0).toLowerCase();
          if (!alfabetoValido.includes(letra)) letra = '#';
          
          if (!gruposPorLetra[letra]) gruposPorLetra[letra] = [];
          gruposPorLetra[letra].push(item);
        });

        const chavesLetras = Object.keys(gruposPorLetra);
        const cotaPorLetra = Math.floor(META_MAXIMA / chavesLetras.length);
        let termosEquilibrados = [];

        chavesLetras.forEach(letra => {
          const listaLetra = gruposPorLetra[letra];
          // Embaralha de forma aleatória mantendo a representatividade da letra
          listaLetra.sort(() => Math.random() - 0.5);
          termosEquilibrados.push(...listaLetra.slice(0, cotaPorLetra));
        });

        // Preenche eventuais vagas restantes para atingir exatamente a meta
        if (termosEquilibrados.length < META_MAXIMA) {
          const restantes = termosBrutos.filter(t => !termosEquilibrados.includes(t));
          restantes.sort(() => Math.random() - 0.5);
          const vagasFaltantes = META_MAXIMA - termosEquilibrados.length;
          termosEquilibrados.push(...restantes.slice(0, vagasFaltantes));
        }

        termosFinais = termosEquilibrados;
      }

      // 3. Atualização do estado global e da interface
      projetoLivro.dicionario = termosFinais;
      reconstruirIndices();
      renderizarListaTermos();

      statusEl.innerText = `STATUS: ${projetoLivro.dicionario.length} TERMOS INDEXADOS!`;
      alert(`Sucesso! Foram indexados ${projetoLivro.dicionario.length} termos equilibrados.`);

    } catch (erro) {
      statusEl.innerText = "STATUS: ERRO NO PROCESSAMENTO";
      console.error("Erro ao processar base.txt:", erro);
      alert("Ocorreu um erro ao estruturar os dados do arquivo.");
    }
  };

  reader.readAsText(file);
}

  async function carregarImagemPersonagem(event) {
    const file = event.target.files[0];
    if (!file || !characterSelecionadoId) return;
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) return alert("Configure o Token do GitHub!");

    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64Content = e.target.result.split(',')[1];
      const fileName = `assets/${characterSelecionadoId}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
      const url = `https://api.github.com/repos/${repo}/contents/${fileName}`;

      try {
        const res = await fetch(url, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Foto ${characterSelecionadoId}`, content: base64Content })
        });
        if (res.ok) {
          const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${fileName}`;
          const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
          p.imagemUrl = rawUrl;
          reconstruirIndices();
          selecionarPersonagem(characterSelecionadoId);
          alert("Foto salva!");
        }
      } catch(err) { alert("Erro ao enviar foto."); }
    };
    reader.readAsDataURL(file);
  }

  async function salvarNoGitHub() {
    salvarCapituloAtualNaMemoria();
    if (characterSelecionadoId) atualizarPersonagemAtual();

    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) { alert("Configure o Token!"); configurarGitHub(); return; }

    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    try {
      let sha = "";
      const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (getRes.ok) sha = (await getRes.json()).sha;

      const payloadSalvar = {
        metadados: projetoLivro.metadados,
        capitulos: projetoLivro.capitulos,
        personagens: projetoLivro.personagens,
        dicionario: projetoLivro.dicionario.length > 5000 ? projetoLivro.dicionario.slice(0, 100) : projetoLivro.dicionario
      };

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(payloadSalvar, null, 2))));
      const putRes = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Atualização GraphZO Mobile", content: contentBase64, sha: sha || undefined })
      });

      if (putRes.ok) alert("Salvo no GitHub!");
    } catch (e) { alert("Erro de conexão."); }
  }

  async function puxarDoGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) return;

    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json();
      if (res.ok) {
        const carregado = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        projetoLivro.metadados = carregado.metadados || projetoLivro.metadados;
        projetoLivro.capitulos = carregado.capitulos || projetoLivro.capitulos;
        projetoLivro.personagens = carregado.personagens || [];
        if (carregado.dicionario) projetoLivro.dicionario = carregado.dicionario;
        
        reconstruirIndices();
        renderizarListaCapitulos();
        carregarCapituloNaTela(Object.keys(projetoLivro.capitulos)[0]);
        if(!silencioso) alert("Dados carregados!");
      }
    } catch(e) {}
  }

  async function listarCommitsGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    if (!token) return;

    const descarteLista = JSON.parse(localStorage.getItem("commits_descartados") || "[]");
    const url = `https://api.github.com/repos/${repo}/commits?path=historia.json`;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const commits = await res.json();
      if (res.ok && Array.isArray(commits)) {
        const sel = document.getElementById("selectCommits");
        sel.innerHTML = '<option value="">-- Versões --</option>';
        commits.forEach(c => {
          if (!descarteLista.includes(c.sha)) {
            const opt = document.createElement("option");
            opt.value = c.sha;
            const dt = new Date(c.commit.author.date);
            opt.textContent = `[${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}] ${c.commit.message.substring(0, 15)}`;
            sel.appendChild(opt);
          }
        });
      }
    } catch(e) {}
  }

  async function carregarVersaoSelecionada() {
    const repo = localStorage.getItem("gh_repo") || "andreyoldekamp-del/EditorUltimaMemoria";
    const token = localStorage.getItem("gh_token");
    const sha = document.getElementById("selectCommits").value;
    if (!token || !sha) return;

    const url = `https://api.github.com/repos/${repo}/contents/historia.json?ref=${sha}`;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json();
      if (res.ok) {
        const carregado = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        projetoLivro.capitulos = carregado.capitulos || projetoLivro.capitulos;
        projetoLivro.personagens = carregado.personagens || [];
        if (carregado.dicionario) projetoLivro.dicionario = carregado.dicionario;
        
        reconstruirIndices();
        renderizarListaCapitulos();
        carregarCapituloNaTela(Object.keys(projetoLivro.capitulos)[0]);
        renderizarListaPersonagens();
        alert("Versão carregada!");
      }
    } catch(e) {}
  }

  function descartarVersaoAtual() {
    const sha = document.getElementById("selectCommits").value;
    if (!sha) return alert("Selecione uma versão.");
    const descarte = JSON.parse(localStorage.getItem("commits_descartados") || "[]");
    descarte.push(sha);
    localStorage.setItem("commits_descartados", JSON.stringify(descarte));
    listarCommitsGitHub(true);
    alert("Versão ocultada.");
  }

  function atualizarContador() {
    const texto = document.getElementById("editorContent").innerText;
    document.getElementById("wordCount").innerText = `PALAVRAS: ${texto.trim() ? texto.trim().split(/\s+/).length : 0}`;
