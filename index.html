<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // ÚLTIMA MEMÓRIA [NEON V5]</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --bg-card: #111827;
      --accent-cyan: #06b6d4;
      --accent-hover: #22d3ee;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-neon: #1e3a8a;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }

    h1 { font-size: 18px; color: var(--accent-cyan); letter-spacing: 2px; }
    h1 span { color: var(--text-muted); font-size: 11px; }

    .nav-bar {
      background: var(--bg-card);
      padding: 8px 24px;
      border-bottom: 1px solid var(--border-neon);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      background: var(--bg-panel);
      padding: 8px 24px;
      border-bottom: 1px solid var(--border-neon);
      align-items: center;
      flex-wrap: wrap;
    }

    button, select {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover, select:hover {
      background: var(--accent-cyan);
      color: var(--bg-base);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .btn-save { background: var(--success); border-color: var(--success); color: white; }
    .btn-save:hover { background: #059669; color: white; box-shadow: 0 0 10px var(--success); }
    
    .btn-history { background: var(--warning); border-color: var(--warning); color: #030712; }
    .btn-history:hover { background: #d97706; color: white; box-shadow: 0 0 10px var(--warning); }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    sidebar {
      width: 300px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-neon);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-neon);
      font-size: 13px;
      color: var(--accent-cyan);
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .item-card {
      padding: 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-bottom: 6px;
      font-size: 12px;
      border: 1px solid transparent;
      transition: 0.15s;
      background: var(--bg-card);
    }

    .item-card:hover { border-color: var(--accent-cyan); }
    .item-card.active { border-color: var(--accent-cyan); background: #082f49; }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 40px;
    }

    #editorContent {
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
      min-height: 100%;
      background: var(--bg-card);
      padding: 40px;
      border-radius: 4px;
      border: 1px solid var(--border-neon);
      outline: none;
      font-family: 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.6;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
    }

    #editorContent p { margin-bottom: 1em; }

    .status-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--accent-cyan);
      padding: 6px 24px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <h1>SYS_GRAPHZO // <span>NEON V5 [ULTIMA MEMORIA]</span></h1>
    <div>
      <button onclick="configurarGitHub()">⚙️ Configurar</button>
      <button onclick="puxarDoGitHub()">📥 Carregar Atual</button>
      <button class="btn-save" onclick="salvarNoGitHub()">☁️ Salvar (Push)</button>
    </div>
  </header>

  <div class="nav-bar">
    <button onclick="mudarAba('editor')">📂 01. Editor</button>
    <button onclick="mudarAba('personagens')">👤 02. Personagens</button>
    <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
      <select id="selectCommits" style="max-width: 250px;">
        <option value="">-- Clique em Listar Histórico --</option>
      </select>
      <button class="btn-history" onclick="listarCommitsGitHub()">📜 Listar Versões Git</button>
      <button onclick="carregarVersaoSelecionada()">📥 Baixar Versão Escolhida</button>
    </div>
  </div>

  <div class="toolbar" id="toolbarEditor">
    <button onclick="formatar('bold')"><b>B</b></button>
    <button onclick="formatar('italic')"><i>I</i></button>
    <button onclick="formatar('underline')"><u>U</u></button>
    <select onchange="mudarFonte(this.value)">
      <option value="Times New Roman">Times New Roman</option>
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Courier New">Courier New</option>
    </select>
    <button onclick="inserirParagrafoID()">➕ Novo Parágrafo Rastreável</button>
  </div>

  <!-- ABA 1: EDITOR DE CAPÍTULOS -->
  <div class="main-container" id="containerEditor">
    <sidebar>
      <div class="sidebar-header">📑 CAPÍTULOS ATIVOS</div>
      <div class="list-container" id="chaptersList"></div>
    </sidebar>

    <div class="editor-area">
      <div id="editorContent" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>

  <!-- ABA 2: PERSONAGENS -->
  <div class="main-container" id="painelPersonagens" style="display: none;">
    <sidebar>
      <div class="sidebar-header">
        <span>👤 ELENCO CADASTRADO</span>
        <button onclick="criarNovoPersonagem()" style="padding: 2px 8px;">+ NOVO</button>
      </div>
      <div class="list-container" id="listaPersonagens"></div>
    </sidebar>

    <div style="flex: 1; padding: 40px; overflow-y: auto; background: var(--bg-base);">
      <div style="max-width: 750px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: 4px; border: 1px solid var(--border-neon);">
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
          <div style="width: 140px; height: 140px; background: var(--bg-base); border: 1px solid var(--accent-cyan); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column;">
            <img id="charAvatarPreview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <input type="file" id="charImageInput" accept="image/*" style="display: none;" onchange="carregarImagemPersonagem(event)">
            <button onclick="document.getElementById('charImageInput').click()" style="font-size: 10px; margin-top: 5px;">📷 FOTO</button>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="charNome" placeholder="Nome do Personagem" onchange="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
            <input type="text" id="charPapel" placeholder="Papel na História" onchange="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
            <input type="text" id="charTags" placeholder="Tags (separadas por vírgula)" onchange="atualizarPersonagemAtual()" style="padding: 8px; background: var(--bg-base); color: white; border: 1px solid var(--accent-cyan); border-radius: 2px;">
          </div>
        </div>
        <label style="font-size: 12px; color: var(--accent-cyan);">BIOGRAFIA / XHTML DO PERSONAGEM:</label>
        <div id="charBiografia" contenteditable="true" onblur="atualizarPersonagemAtual()" style="min-height: 200px; background: var(--bg-base); border: 1px solid var(--border-neon); padding: 15px; margin-top: 8px; border-radius: 2px; outline: none;"></div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">STATUS: SISTEMA PRONTO</span>
    <span id="wordCount">PALAVRAS: 0</span>
  </div>

<script>
  let projetoLivro = {
    "metadados": { "titulo": "Última Memória", "autor": "Autor" },
    "capitulos": {
      "cap_1": {
        "titulo": "Capítulo 1: O Despertar",
        "conteudo_xhtml": '<p id="cap_1_p1">Carregue seus dados da nuvem...</p>'
      }
    },
    "personagens": []
  };

  let capituloAtual = "cap_1";
  let characterSelecionadoId = null;

  window.onload = async function() {
    renderizarListaCapitulos();
    carregarCapituloNaTela("cap_1");
    if (localStorage.getItem("gh_repo") && localStorage.getItem("gh_token")) {
      await puxarDoGitHub(true);
    }
  };

  function mudarAba(aba) {
    document.getElementById('containerEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('toolbarEditor').style.display = aba === 'editor' ? 'flex' : 'none';
    document.getElementById('painelPersonagens').style.display = aba === 'personagens' ? 'flex' : 'none';
    if (aba === 'personagens') renderizarListaPersonagens();
  }

  function renderizarListaCapitulos() {
    const lista = document.getElementById('chaptersList');
    lista.innerHTML = '';
    for (const [id, cap] of Object.entries(projetoLivro.capitulos)) {
      const item = document.createElement('div');
      item.className = 'item-card' + (id === capituloAtual ? ' active' : '');
      item.innerHTML = `<strong>${cap.titulo}</strong>`;
      item.onclick = () => trocarCapitulo(id);
      lista.appendChild(item);
    }
  }

  function trocarCapitulo(capId) {
    salvarCapituloAtualNaMemoria();
    capituloAtual = capId;
    renderizarListaCapitulos();
    carregarCapituloNaTela(capId);
  }

  function salvarCapituloAtualNaMemoria() {
    if (projetoLivro.capitulos[capituloAtual]) {
      projetoLivro.capitulos[capituloAtual].conteudo_xhtml = document.getElementById("editorContent").innerHTML;
    }
  }

  function carregarCapituloNaTela(capId) {
    capituloAtual = capId;
    if (projetoLivro.capitulos[capId]) {
      document.getElementById("editorContent").innerHTML = projetoLivro.capitulos[capId].conteudo_xhtml;
      atualizarContador();
    }
  }

  function renderizarListaPersonagens() {
    const lista = document.getElementById('listaPersonagens');
    lista.innerHTML = '';
    if (!projetoLivro.personagens) projetoLivro.personagens = [];
    projetoLivro.personagens.forEach(p => {
      const item = document.createElement('div');
      item.className = 'item-card' + (p.id === characterSelecionadoId ? ' active' : '');
      item.innerHTML = `<strong>${p.nome || 'Sem nome'}</strong><br><small style="color:var(--text-muted)">${p.papel || 'Sem papel'}</small>`;
      item.onclick = () => selecionarPersonagem(p.id);
      lista.appendChild(item);
    });
    if (projetoLivro.personagens.length > 0 && !characterSelecionadoId) {
      selecionarPersonagem(projetoLivro.personagens[0].id);
    }
  }

  function criarNovoPersonagem() {
    const novo = {
      id: 'char_' + Date.now(),
      nome: 'Novo Personagem',
      papel: 'Secundário',
      caracteristicas: [],
      imagemUrl: '',
      biografia_xhtml: '<p>Biografia...</p>'
    };
    if (!projetoLivro.personagens) projetoLivro.personagens = [];
    projetoLivro.personagens.push(novo);
    renderizarListaPersonagens();
    selecionarPersonagem(novo.id);
  }

  function selecionarPersonagem(id) {
    characterSelecionadoId = id;
    const p = projetoLivro.personagens.find(item => item.id === id);
    if (!p) return;

    document.getElementById('charNome').value = p.nome || '';
    document.getElementById('charPapel').value = p.papel || '';
    document.getElementById('charTags').value = (p.caracteristicas || []).join(', ');
    document.getElementById('charBiografia').innerHTML = p.biografia_xhtml || '';

    const imgPreview = document.getElementById('charAvatarPreview');
    if (p.imagemUrl) {
      imgPreview.src = p.imagemUrl;
      imgPreview.style.display = 'block';
    } else {
      imgPreview.style.display = 'none';
    }
    renderizarListaPersonagens();
  }

  function atualizarPersonagemAtual() {
    const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
    if (!p) return;
    p.nome = document.getElementById('charNome').value;
    p.papel = document.getElementById('charPapel').value;
    p.caracteristicas = document.getElementById('charTags').value.split(',').map(s => s.trim()).filter(Boolean);
    p.biografia_xhtml = document.getElementById('charBiografia').innerHTML;
    renderizarListaPersonagens();
  }

  async function carregarImagemPersonagem(event) {
    const file = event.target.files[0];
    if (!file || !characterSelecionadoId) return;

    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!repo || !token) { alert("Configure o GitHub primeiro!"); return; }

    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64Content = e.target.result.split(',')[1];
      const fileName = `assets/${characterSelecionadoId}_${file.name.replace(/\s+/g, '_')}`;
      const url = `https://api.github.com/repos/${repo}/contents/${fileName}`;

      document.getElementById("statusText").innerText = "STATUS: ENVIANDO IMAGEM...";
      const res = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `Upload avatar ${characterSelecionadoId}`, content: base64Content })
      });

      if (res.ok) {
        const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${fileName}`;
        const p = projetoLivro.personagens.find(item => item.id === characterSelecionadoId);
        p.imagemUrl = rawUrl;
        selecionarPersonagem(characterSelecionadoId);
        document.getElementById("statusText").innerText = "STATUS: IMAGEM SALVA!";
      } else {
        alert("Erro ao enviar imagem.");
      }
    };
    reader.readAsDataURL(file);
  }

  function formatar(cmd) { document.execCommand(cmd, false, null); }

  function mudarFonte(fonte) {
    const selecao = window.getSelection();
    if (!selecao.rangeCount) return;
    const span = document.createElement("span");
    span.style.fontFamily = fonte;
    span.appendChild(selecao.getRangeAt(0).extractContents());
    selecao.getRangeAt(0).insertNode(span);
  }

  function inserirParagrafoID() {
    const editor = document.getElementById("editorContent");
    const pId = `${capituloAtual}_p_${Date.now()}`;
    const p = document.createElement("p");
    p.id = pId;
    p.innerHTML = "Novo parágrafo rastreável...";
    editor.appendChild(p);
  }

  function configurarGitHub() {
    const repo = prompt("Repositório (ex: andreyoldekamp-del/EditorUltimaMemoria):", localStorage.getItem("gh_repo") || "");
    const token = prompt("Personal Access Token:", localStorage.getItem("gh_token") || "");
    if (repo && token) {
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);
      alert("Configurações salvas!");
      puxarDoGitHub();
    }
  }

  // LISTA OS COMMITS DO HISTÓRICO DO GITHUB
  async function listarCommitsGitHub() {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!repo || !token) { alert("Configure o GitHub primeiro!"); return; }

    document.getElementById("statusText").innerText = "STATUS: BUSCANDO HISTÓRICO DE VERSÕES...";
    const url = `https://api.github.com/repos/${repo}/commits?path=historia.json`;

    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (res.ok) {
        const commits = await res.json();
        const select = document.getElementById("selectCommits");
        select.innerHTML = '';
        
        commits.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.sha;
          const dataFormatada = new Date(c.commit.author.date).toLocaleString();
          opt.textContent = `${c.commit.message.substring(0, 35)} (${dataFormatada})`;
          select.appendChild(opt);
        });

        document.getElementById("statusText").innerText = `STATUS: ${commits.length} VERSÕES ENCONTRADAS`;
        alert("Versões listadas no menu superior com sucesso!");
      } else {
        alert("Nenhum histórico encontrado para historia.json.");
      }
    } catch(e) {
      console.error(e);
      alert("Erro ao buscar histórico.");
    }
  }

  // BAIXA A VERSÃO ESCOLHIDA NO SELECT DO COMMIT
  async function carregarVersaoSelecionada() {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    const sha = document.getElementById("selectCommits").value;

    if (!repo || !token || !sha) { alert("Selecione uma versão válida no menu ao lado!"); return; }

    document.getElementById("statusText").innerText = "STATUS: BAIXANDO VERSÃO HISTÓRICA...";
    const url = `https://api.github.com/repos/${repo}/contents/historia.json?ref=${sha}`;

    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (res.ok) {
        const fileData = await res.json();
        const jsonString = decodeURIComponent(escape(atob(fileData.content)));
        projetoLivro = JSON.parse(jsonString);
        if(!projetoLivro.personagens) projetoLivro.personagens = [];

        renderizarListaCapitulos();
        const primeiroCap = Object.keys(projetoLivro.capitulos)[0];
        if(primeiroCap) carregarCapituloNaTela(primeiroCap);
        
        alert("Versão histórica carregada com sucesso na tela!");
        document.getElementById("statusText").innerText = "STATUS: VERSÃO HISTÓRICA CARREGADA";
      } else {
        alert("Erro ao baixar o arquivo desta versão.");
      }
    } catch(e) {
      console.error(e);
      alert("Erro ao processar versão.");
    }
  }

  async function puxarDoGitHub(silencioso = false) {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!repo || !token) { if(!silencioso) alert("Configure o GitHub primeiro!"); return; }

    if(!silencioso) document.getElementById("statusText").innerText = "STATUS: CARREGANDO...";
    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;

    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (res.ok) {
        const fileData = await res.json();
        const jsonString = decodeURIComponent(escape(atob(fileData.content)));
        projetoLivro = JSON.parse(jsonString);
        if(!projetoLivro.personagens) projetoLivro.personagens = [];

        renderizarListaCapitulos();
        const primeiroCap = Object.keys(projetoLivro.capitulos)[0];
        if(primeiroCap) carregarCapituloNaTela(primeiroCap);
        
        if(!silencioso) alert("Versão atual carregada com sucesso!");
        document.getElementById("statusText").innerText = "STATUS: SINCRONIZADO";
      } else {
        if(!silencioso) alert("Arquivo historia.json não encontrado.");
      }
    } catch(e) {
      console.error(e);
      if(!silencioso) alert("Erro ao carregar.");
    }
  }

  async function salvarNoGitHub() {
    salvarCapituloAtualNaMemoria();
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");

    if (!repo || !token) { alert("Configure o GitHub primeiro!"); configurarGitHub(); return; }

    document.getElementById("statusText").innerText = "STATUS: SALVANDO...";
    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;

    try {
      let sha = "";
      const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      }

      const jsonString = JSON.stringify(projetoLivro, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

      const putRes = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Commit via Editor Neon V5",
          content: contentBase64,
          sha: sha ? sha : undefined
        })
      });

      if (putRes.ok) {
        document.getElementById("statusText").innerText = "STATUS: SALVO COM SUCESSO!";
        alert("Salvo com sucesso na nuvem!");
      } else {
        const err = await putRes.json();
        alert("Erro ao salvar: " + err.message);
      }
    } catch (e) {
      console.error(e);
      alert("Erro de conexão.");
    }
  }

  function atualizarContador() {
    const texto = document.getElementById("editorContent").innerText;
    const palavras = texto.trim() ? texto.trim().split(/\s+/).length : 0;
    document.getElementById("wordCount").innerText = `PALAVRAS: ${palavras}`;
  }

  document.getElementById("editorContent").addEventListener("input", atualizarContador);
</script>

</body>
</html>
