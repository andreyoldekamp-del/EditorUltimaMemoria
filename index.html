<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // TESTE DIRETO</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --border-neon: #1e3a8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-container {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #editorContent {
      width: 100%;
      max-width: 700px;
      height: 60vh;
      background: #111827;
      border: 1px solid var(--border-neon);
      padding: 20px;
      color: white;
      font-size: 16px;
      outline: none;
      border-radius: 4px;
      line-height: 1.5;
    }

    #statusInfo {
      margin-bottom: 10px;
      color: #9ca3af;
      font-size: 12px;
    }

    /* POPUP DE TESTE */
    #popupDeteccao {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 320px;
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <header>
    <h1>GraphZO // TESTE DIRETO DE DETECÇÃO</h1>
  </header>

  <div class="editor-container">
    <div id="statusInfo">Status: Carregando termos de teste...</div>
    <div id="editorContent" contenteditable="true" spellcheck="false"></div>
  </div>

  <!-- POPUP -->
  <div id="popupDeteccao">
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
      <span id="popupBadge" style="font-size: 10px; font-weight: bold; padding: 2px 6px; background: var(--accent-cyan); color: black;">TIPO</span>
      <button onclick="fecharPopup()" style="padding: 0 6px; font-size: 10px; cursor: pointer;">X</button>
    </div>
    <div id="popupPalavra" style="font-size: 16px; font-weight: bold; margin-bottom: 4px;">Palavra</div>
    <div id="popupSignificado" style="font-size: 12px; color: #d1d5db;">Significado aqui...</div>
  </div>

<script>
  // Listas unificadas para teste direto
  let baseDados = {
    personagens: [
      { nome: "Teddy", papel: "Protagonista", bio: "Jovem do Kentucky." },
      { nome: "Jeames", papel: "Irmão", bio: "Irmão mais novo." },
      { nome: "Suzane", papel: "Misteriosa", bio: "Personagem secundária." }
    ],
    dicionario: [
      { termo: "vento", categoria: "Clima", definicao: "Movimento natural do ar." },
      { termo: "casa", categoria: "Local", definicao: "Residência da família." },
      { termo: "chuva", categoria: "Clima", definicao: "Precipitação de água." },
      { termo: "noite", categoria: "Tempo", definicao: "Período de escuridão." },
      { termo: "tempo", categoria: "Meteorologia", definicao: "Condições atmosféricas." },
      { termo: "clima", categoria: "Meteorologia", definicao: "Padrão meteorológico." },
      { termo: "futuro", categoria: "Conceito", definicao: "Tempo que ainda não chegou." }
    ]
  };

  let indiceGeral = new Map();

  function normalizar(texto) {
    if (!texto) return "";
    return texto
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[\u00A0\u200B]/g, " ")
      .replace(/[.,!?;:()"'«»—–-]/g, "")
      .trim()
      .toLowerCase();
  }

  function construirIndiceUnico() {
    indiceGeral.clear();

    // Adiciona personagens
    baseDados.personagens.forEach(p => {
      let chave = normalizar(p.nome);
      if (chave) {
        indiceGeral.set(chave, {
          tipo: "PERSONAGEM",
          palavra: p.nome,
          sub: `Papel: ${p.papel}`,
          significado: p.bio
        });
      }
    });

    // Adiciona dicionário
    baseDados.dicionario.forEach(d => {
      let chave = normalizar(d.termo);
      if (chave) {
        indiceGeral.set(chave, {
          tipo: "DICIONÁRIO",
          palavra: d.termo,
          sub: `Categoria: ${d.categoria}`,
          significado: d.definicao
        });
      }
    });

    document.getElementById("statusInfo").innerText = `Status: ${indiceGeral.size} termos indexados prontos para teste!`;
  }

  window.onload = function() {
    construirIndiceUnico();
    const ed = document.getElementById("editorContent");
    
    // Ouve tanto a digitação quanto o espaço/pontuação
    ed.addEventListener("input", detectarPalavra);
  };

  function detectarPalavra() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    const node = range.startContainer;
    if (node.nodeType !== Node.TEXT_NODE) return;

    const textoAteCursor = node.textContent.substring(0, range.startOffset).replace(/\u00A0/g, " ");
    
    // Captura a última palavra antes de espaço ou pontuação
    const match = textoAteCursor.match(/([a-zA-ZÀ-ÿ0-9_-]+)[\s.,!?;:]+$/);
    if (!match) return;

    const palavraBruta = match[1];
    const chave = normalizar(palavraBruta);

    if (chave.length < 2) return;

    // Busca direta no índice único
    if (indiceGeral.has(chave)) {
      const item = indiceGeral.get(chave);
      mostrarPopup(item.tipo, item.palavra, `${item.sub} — ${item.significado}`);
    }
  }

  function mostrarPopup(tipo, termo, texto) {
    const pop = document.getElementById("popupDeteccao");
    const badge = document.getElementById("popupBadge");
    
    badge.innerText = tipo;
    badge.style.background = tipo === "PERSONAGEM" ? "var(--accent-purple)" : "var(--accent-cyan)";
    badge.style.color = tipo === "PERSONAGEM" ? "white" : "black";

    document.getElementById("popupPalavra").innerText = termo;
    document.getElementById("popupSignificado").innerText = texto;
    pop.style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popupDeteccao").style.display = "none";
  }
</script>

</body>
</html>
