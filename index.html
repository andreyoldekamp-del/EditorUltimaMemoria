<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZO // MÍNIMO + DICIONÁRIO 10K</title>
  <style>
    :root {
      --bg-base: #030712;
      --bg-panel: #0b0f19;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --border-neon: #1e3a8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--accent-cyan);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, label.file-btn {
      background: var(--bg-base);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: inline-block;
    }

    button:hover, label.file-btn:hover { background: var(--accent-cyan); color: var(--bg-base); }

    .editor-container {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #editorContent {
      width: 100%;
      max-width: 700px;
      height: 60vh;
      background: #111827;
      border: 1px solid var(--border-neon);
      padding: 20px;
      color: white;
      font-size: 16px;
      outline: none;
      border-radius: 4px;
      line-height: 1.5;
    }

    #statusInfo {
      margin-bottom: 10px;
      color: #9ca3af;
      font-size: 12px;
    }

    /* POPUP DE TESTE */
    #popupDeteccao {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 320px;
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <header>
    <h1>GraphZO // MÍNIMO + 10K</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <label class="file-btn">
        📂 Carregar Dicionário (.txt)
        <input type="file" id="txtInput" accept=".txt" style="display: none;" onchange="carregarDicionarioTxt(event)">
      </label>
      <button onclick="configurarGitHub()">⚙️ Config</button>
      <button onclick="puxarDoGitHub()">📥 Puxar GitHub</button>
    </div>
  </header>

  <div class="editor-container">
    <div id="statusInfo">
      Status: Dicionário interno ativo (2 termos). Carregue seu .txt acima para testar os 10k.
    </div>
    <div id="editorContent" contenteditable="true" spellcheck="false"></div>
  </div>

  <!-- POPUP -->
  <div id="popupDeteccao">
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
      <span id="popupBadge" style="font-size: 10px; font-weight: bold; padding: 2px 6px; background: var(--accent-cyan); color: black;">TIPO</span>
      <button onclick="fecharPopup()" style="padding: 0 6px; font-size: 10px;">X</button>
    </div>
    <div id="popupPalavra" style="font-size: 16px; font-weight: bold; margin-bottom: 4px;">Palavra</div>
    <div id="popupSignificado" style="font-size: 12px; color: #d1d5db;">Significado aqui...</div>
  </div>

<script>
  let baseDados = {
    personagens: [
      { nome: "Teddy", papel: "Protagonista", bio: "Jovem do Kentucky." }
    ],
    dicionario: [
      { termo: "vento", categoria: "Clima", definicao: "Movimento natural do ar." },
      { termo: "chuva", categoria: "Clima", definicao: "Precipitação de água." }
    ]
  };

  let indiceP = new Map();
  let indiceD = new Map();

  function normalizar(texto) {
    return texto
      .replace(/\u00A0/g, " ")
      .replace(/[.,!?;:()"']/g, "")
      .trim()
      .toLowerCase();
  }

  function reconstruirIndices() {
    indiceP.clear();
    indiceD.clear();
    baseDados.personagens.forEach(p => {
      if (p.nome) indiceP.set(normalizar(p.nome), p);
    });
    baseDados.dicionario.forEach(d => {
      if (d.termo) indiceD.set(normalizar(d.termo), d);
    });
    document.getElementById("statusInfo").innerText = `Status: ${indiceP.size} personagens e ${indiceD.size} palavras indexadas.`;
  }

  window.onload = function() {
    if (!localStorage.getItem("gh_repo")) {
      localStorage.setItem("gh_repo", "andreyoldekamp-del/EditorUltimaMemoria");
    }
    reconstruirIndices();

    const ed = document.getElementById("editorContent");
    ed.addEventListener("input", detectarPalavra);
  };

  function detectarPalavra() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    const node = range.startContainer;
    if (node.nodeType !== Node.TEXT_NODE) return;

    const textoAteCursor = node.textContent.substring(0, range.startOffset).replace(/\u00A0/g, " ");
    
    // Só dispara após digitar espaço ou pontuação no final da palavra
    const match = textoAteCursor.match(/([a-zA-ZÀ-ÿ0-9_-]+)[\s.,!?;:]+$/);
    if (!match) return;

    const palavra = normalizar(match[1]);
    if (palavra.length < 2) return;

    if (indiceP.has(palavra)) {
      const p = indiceP.get(palavra);
      mostrarPopup("PERSONAGEM", p.nome, `${p.papel || 'Personagem'} - ${p.bio || p.biografia_xhtml || ''}`);
      return;
    }

    if (indiceD.has(palavra)) {
      const d = indiceD.get(palavra);
      mostrarPopup("DICIONÁRIO", d.termo, `[${d.categoria || 'Geral'}] ${d.definicao}`);
      return;
    }
  }

  // CARREGA E FILTRA O DICIONÁRIO EM 10K EQUILIBRADOS POR LETRA (A-Z)
  function carregarDicionarioTxt(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById("statusInfo").innerText = "Status: Lendo e filtrando arquivo...";
    const reader = new FileReader();

    reader.onload = function(e) {
      const linhas = e.target.result.split(/\r?\n/);
      const brutos = [];

      for (let i = 0; i < linhas.length; i++) {
        const linha = linhas[i].trim();
        if (!linha) continue;

        let termo = "", categoria = "Vocabulário", definicao = "Palavra validada no dicionário.";

        if (linha.includes("|")) {
          const partes = linha.split("|").map(s => s.trim());
          termo = partes[0];
          if (partes[1]) categoria = partes[1];
          if (partes[2]) definicao = partes[2];
        } else if (linha.includes(":")) {
          const idx = linha.indexOf(":");
          termo = linha.substring(0, idx).trim();
          definicao = linha.substring(idx + 1).trim();
          categoria = "Dicionário";
        } else {
          termo = linha;
        }

        if (termo.length > 0) {
          brutos.push({ termo, categoria, definicao });
        }
      }

      const META = 10000;
      let finais = brutos;

      if (brutos.length > META) {
        const grupos = {};
        const letrasValidas = "abcdefghijklmnopqrstuvwxyzáéíóúâêîôûãõç";

        brutos.forEach(item => {
          let letra = item.termo.charAt(0).toLowerCase();
          if (!letrasValidas.includes(letra)) letra = "#";
          if (!grupos[letra]) grupos[letra] = [];
          grupos[letra].push(item);
        });

        const chaves = Object.keys(grupos);
        const cota = Math.floor(META / chaves.length);
        let equilibrados = [];

        chaves.forEach(letra => {
          const lista = grupos[letra];
          lista.sort(() => Math.random() - 0.5);
          equilibrados.push(...lista.slice(0, cota));
        });

        if (equilibrados.length < META) {
          const restantes = brutos.filter(t => !equilibrados.includes(t));
          restantes.sort(() => Math.random() - 0.5);
          equilibrados.push(...restantes.slice(0, META - equilibrados.length));
        }

        finais = equilibrados;
      }

      baseDados.dicionario = finais;
      reconstruirIndices();
      alert(`Pronto! ${indiceD.size} palavras carregadas e equilibradas de A a Z.`);
    };

    reader.readAsText(file);
  }

  function mostrarPopup(tipo, termo, texto) {
    const pop = document.getElementById("popupDeteccao");
    document.getElementById("popupBadge").innerText = tipo;
    document.getElementById("popupPalavra").innerText = termo;
    document.getElementById("popupSignificado").innerHTML = texto;
    pop.style.display = "block";
  }

  function fecharPopup() {
    document.getElementById("popupDeteccao").style.display = "none";
  }

  function configurarGitHub() {
    const repo = prompt("Repositório:", localStorage.getItem("gh_repo"));
    const token = prompt("Token GitHub:", localStorage.getItem("gh_token") || "");
    if (repo && token) {
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_token", token);
      alert("Configurado!");
    }
  }

  async function puxarDoGitHub() {
    const repo = localStorage.getItem("gh_repo");
    const token = localStorage.getItem("gh_token");
    if (!token) { alert("Configure o Token primeiro!"); return; }

    const url = `https://api.github.com/repos/${repo}/contents/historia.json`;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json();
      if (res.ok) {
        const conteudo = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        if (conteudo.personagens) baseDados.personagens = conteudo.personagens;
        if (conteudo.dicionario && conteudo.dicionario.length > 0) baseDados.dicionario = conteudo.dicionario;
        reconstruirIndices();
        alert("Dados puxados do GitHub com sucesso!");
      } else {
        alert("Erro ao puxar: " + data.message);
      }
    } catch(e) {
      alert("Erro de conexão.");
    }
  }
</script>

</body>
</html>
